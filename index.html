<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GGamble</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><text x='50' y='64' font-size='42' text-anchor='middle' font-family='Arial' font-weight='900' fill='%23e8c45a'>GG</text></svg>">
<style>
:root{
  --bg:#000;--card:#111113;--card2:#18181b;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --txt:#f4f4f5;--mut:#8e8e93;--mut2:#5c5c62;--gold:#c9a43e;--gold2:#e8c45a;--red:#e8524a;--green:#4cc265;--blue:#3b7be0;--purple:#a65ce0;
  --r:28px;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#000;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100vh;overflow-x:hidden}
#main{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--txt)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--red)!important}.pos{color:var(--green)!important}.goldc{color:var(--gold2)!important}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 50% 45%,#2a2006 0,#000 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s var(--ease),transform .7s var(--ease)}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.logo-big{font-size:84px;font-weight:900;letter-spacing:-4px;background:linear-gradient(110deg,#8a6a1c 0%,#f6dc8a 30%,#fff6d6 45%,#c9a43e 60%,#8a6a1c 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoIn 1s var(--spring) both,shine 2.2s 0.6s ease-in-out infinite}
.logo-sub{margin-top:6px;font-size:15px;letter-spacing:8px;color:#bfa25a;text-transform:uppercase;opacity:0;animation:fadeUp .8s .45s var(--ease) forwards}
.splash-bar{margin-top:34px;width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.splash-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6a1c,#f6dc8a);animation:load 1.3s .2s var(--ease) forwards}
@keyframes logoIn{0%{opacity:0;transform:scale(.4) rotate(-8deg);filter:blur(12px)}100%{opacity:1;transform:none;filter:none}}
@keyframes shine{0%{background-position:100% 0}60%,100%{background-position:-60% 0}}
@keyframes load{to{width:100%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:900;background:radial-gradient(circle at 50% 0,#211904 0,#000 55%);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .6s var(--ease)}
.login-box{width:100%;max-width:400px;animation:fadeUp .7s var(--ease)}
.login-box .logo-big{font-size:64px;text-align:center;display:block}
.login-box p.lead{text-align:center;color:var(--mut);margin:6px 0 28px;font-size:15px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;position:relative}
.seg button{flex:1;padding:12px 8px;border-radius:999px;font-weight:600;color:var(--mut);transition:.3s var(--ease);position:relative;z-index:1;white-space:nowrap}
.seg button.on{color:#fff;background:linear-gradient(180deg,#3a3a3f,#26262a);box-shadow:0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.fld{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:16px 18px;font-size:17px;margin-bottom:10px;outline:none;transition:border .2s}
.fld:focus{border-color:rgba(201,164,62,.6)}
.fld::placeholder{color:var(--mut2)}
.err{color:var(--red);font-size:14px;min-height:20px;margin:4px 4px 8px}
.small{font-size:13px;color:var(--mut);text-align:center;margin-top:16px;line-height:1.5}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 22px;border-radius:999px;font-weight:700;font-size:17px;transition:transform .15s var(--ease),filter .2s,opacity .2s;user-select:none}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.w{width:100%}
.btn.white{background:linear-gradient(180deg,#fff,#dcdce0);color:#111;box-shadow:0 6px 20px rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.08)}
.btn.dark{background:linear-gradient(180deg,#2c2c30,#1c1c1f);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn.red{background:linear-gradient(180deg,#e05a4c,#c13b30);color:#fff}
.btn.gold{background:linear-gradient(180deg,#f2d27a,#b98f2a);color:#1d1503}
.btn.blue{background:linear-gradient(180deg,#4b8cf0,#2457c4);color:#fff}
.btn.sm{padding:10px 16px;font-size:15px}
.btn.xs{padding:7px 12px;font-size:13px}
.linkbtn{color:var(--red);font-weight:600;font-size:18px;padding:16px;width:100%}

/* ---------- header ---------- */
#hdr{position:fixed;left:0;right:0;top:0;z-index:50;padding:calc(var(--st) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.85) 40%,rgba(0,0,0,0))}
#hdr>*{pointer-events:auto}
.pill{background:linear-gradient(180deg,rgba(40,40,44,.92),rgba(22,22,25,.92));border:1px solid var(--line2);border-radius:999px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.balpill{display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;min-width:0;flex:0 1 auto}
.gglogo{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:-.5px;background:radial-gradient(circle at 35% 30%,#3a3a40,#121214);border:1px solid var(--line2);color:#f1d27c}
.balwrap{min-width:0}
#hBal{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.05;white-space:nowrap;transition:color .3s}
#hToday{font-size:12.5px;color:var(--mut);font-weight:600;white-space:nowrap}
.lockb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(232,82,74,.22);color:var(--red);flex:none}
.lockb svg{width:18px;height:18px}
.circbtn{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none;margin-left:auto}
.lvlpill{display:flex;align-items:center;gap:4px;padding:5px;flex:none}
.lvlring{position:relative;width:48px;height:48px;display:grid;place-items:center;font-weight:800;font-size:17px}
.lvlring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:17px;color:#2a2003;background:radial-gradient(circle at 35% 30%,#e3c25a,#a8862a);border:2px solid rgba(0,0,0,.4);background-size:cover;background-position:center;flex:none;overflow:hidden}
.bump{animation:bump .5s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- nav ---------- */
#nav{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 10px);z-index:50;display:flex;justify-content:space-between;padding:6px;border-radius:40px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:30px;color:#b8b8bd;font-size:11.5px;font-weight:600;transition:background .35s var(--ease),color .3s,transform .15s}
#nav button svg{width:26px;height:26px}
#nav button.on{background:linear-gradient(180deg,#3a3a3f,#26262a);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.5)}
#nav button:active{transform:scale(.92)}

/* ---------- pages ---------- */
#main{padding:calc(var(--st) + 92px) 16px calc(var(--sb) + 120px);max-width:640px;margin:0 auto}
.page{animation:pageIn .45s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
h1.t{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin:6px 4px 4px;line-height:1.05}
p.sub{color:var(--mut);font-size:17px;margin:6px 4px 18px;line-height:1.35}
.sec{color:#a0a0a6;font-size:15px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;margin:28px 8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec small{letter-spacing:.3px;text-transform:none;font-size:13px;color:var(--mut)}
.card{background:linear-gradient(180deg,#141416,#0d0d0f);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card.tight{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:14px}
.row.sb{justify-content:space-between}
.list .it{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line);transition:background .2s}
.list .it:last-child{border-bottom:0}
.list .it:active{background:rgba(255,255,255,.04)}
.ibox{width:46px;height:46px;border-radius:14px;background:#232327;display:grid;place-items:center;flex:none}
.it .lbl{flex:1;font-size:19px}
.it .val{color:var(--mut);font-size:18px}
.chev{color:var(--mut2);width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#202024;border:1px solid var(--line);font-weight:700;font-size:15px}
.chip.gold{background:rgba(201,164,62,.16);color:var(--gold2);border-color:rgba(201,164,62,.2)}
.chip.red{background:rgba(232,82,74,.18);color:#ff8b82;border-color:rgba(232,82,74,.2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:linear-gradient(180deg,#141416,#0d0d0f);border:1px solid var(--line);border-radius:24px;padding:18px}
.stat small{color:var(--mut);font-size:15px}
.stat b{display:block;font-size:24px;margin-top:6px;letter-spacing:-.4px}
.inp{width:100%;background:#1d1d20;border:1px solid var(--line);border-radius:18px;padding:16px 18px;font-size:18px;outline:none}
.inp:focus{border-color:rgba(201,164,62,.5)}
.bar{height:6px;border-radius:6px;background:#26262a;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d4d4d8,#fff);border-radius:6px;transition:width .6s var(--ease)}
.hint{color:var(--mut);font-size:15px;line-height:1.45;margin:10px 4px}
.tabs{display:flex;background:#141416;border:1px solid var(--line);border-radius:999px;padding:5px;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:11px 18px;border-radius:999px;color:var(--mut);font-weight:600;white-space:nowrap;transition:.3s var(--ease);font-size:16px}
.tabs button.on{background:linear-gradient(180deg,#3a3a3f,#26262a);color:#fff}

/* ---------- sheet / modal ---------- */
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .3s var(--ease)}
.ov.center{align-items:center;padding:16px}
.ov.closing{animation:fadeOut .28s var(--ease) forwards}
.ov.closing .sheet{animation:sheetOut .28s var(--ease) forwards}
@keyframes fadeOut{to{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#2a2a2e,#1a1a1d);border:1px solid var(--line2);border-radius:34px;margin:0 10px calc(var(--sb) + 10px);padding:24px;animation:sheetIn .5s var(--spring);box-shadow:0 30px 80px rgba(0,0,0,.7)}
.ov.center .sheet{margin:0}
@keyframes sheetIn{from{transform:translateY(60%) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetOut{to{transform:translateY(40%) scale(.97);opacity:0}}
.sheet h2{font-size:30px;font-weight:800;letter-spacing:-.8px}
.sheet .x{width:48px;height:48px;border-radius:50%;background:#3a3a3f;display:grid;place-items:center;flex:none}
.full{position:fixed;inset:0;z-index:150;background:#000;overflow:auto;animation:zoomIn .5s var(--ease)}
@keyframes zoomIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.full.closing{animation:zoomOut .3s var(--ease) forwards}
@keyframes zoomOut{to{opacity:0;transform:scale(.94)}}

/* ---------- toast ---------- */
#toasts{position:fixed;top:calc(var(--st) + 14px);left:12px;right:12px;z-index:600;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{max-width:560px;width:100%;display:flex;gap:14px;align-items:center;padding:16px 20px;border-radius:30px;background:linear-gradient(180deg,rgba(52,52,57,.96),rgba(30,30,33,.96));border:1px solid var(--line2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-weight:700;font-size:17px;line-height:1.3;box-shadow:0 18px 40px rgba(0,0,0,.6);animation:toastIn .5s var(--spring)}
.toast.out{animation:toastOut .35s var(--ease) forwards}
.toast .ti{width:32px;height:32px;border-radius:50%;border:2px solid #aaa;display:grid;place-items:center;flex:none;font-size:16px;color:#ccc}
.toast.good .ti{border-color:var(--green);color:var(--green)}
.toast.bad .ti{border-color:var(--red);color:var(--red)}
@keyframes toastIn{from{transform:translateY(-120%) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(-120%);opacity:0}}

/* ---------- win fx ---------- */
#fx{position:fixed;inset:0;z-index:700;pointer-events:none}
#bigwin{position:fixed;inset:0;z-index:690;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,rgba(60,40,0,.75),rgba(0,0,0,.92) 70%);animation:fadeIn .25s}
#bigwin .rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(from 0deg,rgba(255,210,90,.16) 0 8deg,transparent 8deg 20deg);animation:spin 14s linear infinite;mask:radial-gradient(circle,#000 0,transparent 60%);-webkit-mask:radial-gradient(circle,#000 0,transparent 60%)}
#bigwin .bw-t{position:relative;font-size:min(17vw,96px);font-weight:900;letter-spacing:-2px;text-align:center;line-height:.95;background:linear-gradient(180deg,#fff7d1 0%,#f5cf5a 45%,#a77a14 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #4a3405) drop-shadow(0 0 30px rgba(255,200,60,.6));animation:bwIn .8s var(--spring) both}
#bigwin .bw-a{position:relative;margin-top:22px;font-size:min(11vw,56px);font-weight:900;color:#fff;text-shadow:0 0 24px rgba(255,220,120,.8);animation:bwIn .8s .15s var(--spring) both}
#bigwin .bw-s{position:relative;margin-top:30px;color:#d9c48a;font-weight:600;animation:fadeIn 1s 1s both}
#bigwin.epic .bw-t{background:linear-gradient(180deg,#fff 0%,#e6b3ff 35%,#9a3ff0 70%,#4b0f86 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 0 #2a0650) drop-shadow(0 0 40px rgba(190,100,255,.8))}
@keyframes bwIn{0%{transform:scale(.2) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}
.flash{position:fixed;inset:0;z-index:680;pointer-events:none;background:radial-gradient(circle,rgba(255,230,150,.6),rgba(255,200,80,0) 70%);animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}

/* ---------- halle ---------- */
.halle-top{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}
.halle-top .icons{display:flex;gap:10px}
.halle-top .icons{gap:8px}
.halle-top .icons button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.halle-top h1.t{font-size:clamp(32px,10vw,44px)}
.rl .it .chev{display:none}
.stage{position:relative;height:430px;margin:0 -16px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,rgba(40,40,80,.45),transparent 60%),linear-gradient(180deg,#000 0,#05050d 70%,#0d0d1c 100%)}
.stage:before{content:"";position:absolute;inset:0;background:conic-gradient(from 180deg at 30% -10%,transparent 0 160deg,rgba(255,255,255,.05) 170deg,transparent 185deg),conic-gradient(from 180deg at 70% -10%,transparent 0 170deg,rgba(255,255,255,.05) 180deg,transparent 195deg);pointer-events:none}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(180deg,#0e0e22,#151532);border-top:1px solid rgba(160,160,255,.12)}
.carousel{position:absolute;inset:0 0 0 0;display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:40px calc(50% - 90px) 0;scrollbar-width:none;align-items:flex-start}
.carousel::-webkit-scrollbar{display:none}
.mini{flex:none;width:180px;scroll-snap-align:center;transition:transform .5s var(--ease),filter .5s;transform:scale(.82);filter:brightness(.55);cursor:pointer}
.mini.cur{transform:scale(1);filter:none}
.neon{position:absolute;font-weight:900;font-size:26px;pointer-events:none;opacity:.9}
.arrow{position:absolute;top:340px;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;z-index:3}
.arrow.l{left:6px}.arrow.r{right:6px}
.slotcard{position:relative;margin-top:-30px;z-index:4;padding:22px}
.slotcard .top{display:flex;align-items:center;gap:12px}
.slotcard .bar{flex:1}
.slotcard h3{font-size:42px;font-weight:800;letter-spacing:-1.4px;margin-top:20px}
.paychips{display:flex;gap:10px;overflow-x:auto;margin:18px 0;scrollbar-width:none}
.paychips::-webkit-scrollbar{display:none}
.paychips span{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:#1d1d21;font-weight:800;font-size:17px}
.paychips em{font-style:normal;font-size:26px;letter-spacing:4px}
.sl-list .sl{display:flex;align-items:center;gap:16px;padding:16px;border-radius:26px;margin-bottom:12px;border:1px solid rgba(255,255,255,.07);transition:transform .15s}
.sl-list .sl:active{transform:scale(.98)}
.sl-list .sl.sel{border:2px solid #f2b844}
.sl .ico{width:74px;height:74px;border-radius:20px;background:#f5efe3;display:grid;place-items:center;font-size:40px;flex:none;border:3px solid currentColor}
.sl .nm{font-size:22px;font-weight:800}
.sl .ds{color:#b0b0b6;font-size:16px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .mx{font-weight:800;font-size:18px}
.sl .star{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;margin-left:auto;flex:none}
.sl.locked{opacity:.55}
.star.on{color:#f5c84a}
.star.on svg{fill:#f5c84a}

/* ---------- cabinet ---------- */
.cab{--c:#c9a43e;--c2:#1a2c6c;position:relative;margin:0 auto;width:100%;max-width:420px;padding:0 4%;}
.cab .arch{position:relative;height:90px;border-radius:200px 200px 0 0;background:linear-gradient(180deg,var(--c2),#060a1e);border:4px solid var(--c);border-bottom:0;overflow:hidden}
.cab .bulbs{position:absolute;inset:0}
.cab .bulbs i{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff3c4;box-shadow:0 0 8px #ffd56a,0 0 16px #ffb31a;animation:bulb 1.2s infinite}
@keyframes bulb{0%,100%{opacity:1}50%{opacity:.25}}
.cab .body{background:linear-gradient(90deg,#4a3a0c,var(--c) 6%,#5a4610 10%,var(--c2) 12%,#0a1030 50%,var(--c2) 88%,#5a4610 90%,var(--c) 94%,#4a3a0c);padding:14px 16px 18px;border-radius:0 0 18px 18px}
.cab .scr{border:4px solid var(--c);border-radius:16px;background:repeating-conic-gradient(from 0deg at 50% 60%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 12deg),radial-gradient(circle at 50% 60%,var(--c2),#020617);padding:10px 8px;text-align:center;overflow:hidden;position:relative;margin-bottom:12px}
.cab .marq{font-size:12px;font-weight:900;letter-spacing:3px;color:#fff;white-space:nowrap;overflow:hidden;opacity:.85}
.cab .marq span{display:inline-block;animation:marq 9s linear infinite;padding-left:100%}
@keyframes marq{to{transform:translateX(-100%)}}
.cab .ttl{font-size:clamp(26px,8vw,42px);font-weight:900;letter-spacing:-.5px;line-height:1.05;margin:6px 0;color:transparent;background:linear-gradient(180deg,#fff8d8,#f2cf63 50%,#a07818);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 0 rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(255,210,90,.45));text-transform:uppercase}
.cab .ttl-ic{font-size:30px;letter-spacing:12px}
.cab .reelbox{position:relative;background:linear-gradient(180deg,#2b2006,#120c02);border-radius:18px;padding:10px;border:2px solid #3c2d08}
.cab .reels{display:flex;gap:4px;position:relative;border-radius:8px;overflow:hidden;background:#000;padding:3px}
.reel{flex:1;overflow:hidden;position:relative;border-radius:4px;background:linear-gradient(180deg,#9c9c9c,#f4f4f4 25%,#fff 50%,#f4f4f4 75%,#9c9c9c)}
.strip{will-change:transform}
.cell{display:grid;place-items:center;font-size:var(--fs,42px);line-height:1;position:relative;font-family:Georgia,"Times New Roman",serif;font-weight:900}
.cell.L{font-size:calc(var(--fs,42px)*.95)}
.cell.win{animation:cellwin .9s ease-in-out infinite}
.cell.win:after{content:"";position:absolute;inset:3px;border-radius:8px;border:3px solid #ffd447;box-shadow:0 0 16px #ffc61a,inset 0 0 14px rgba(255,200,40,.5)}
@keyframes cellwin{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
.reel.spin .strip{filter:blur(1.6px)}
.lines{position:absolute;inset:13px;pointer-events:none}
.lines path{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px currentColor);stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cab .led{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:8px 14px;background:#0a0703;border-radius:10px;border:1px solid #2a1f08;font-family:"Courier New",monospace;font-weight:900;font-size:20px;color:#ffcf6a;text-shadow:0 0 8px #ff9d1a}
.cab .led small{display:block;font-size:9px;color:#6d5a2a;letter-spacing:1px;text-shadow:none}
.cab .btns{display:flex;gap:10px;align-items:center;margin-top:12px;padding:0 6px}
.cab .btns i{width:44px;height:16px;border-radius:4px;background:linear-gradient(180deg,#d8d8d8,#8a8a8a);box-shadow:0 3px 0 #444}
.cab .btns i:first-child{background:linear-gradient(180deg,#7bc3ff,#2a7fd4)}
.cab .btns b{margin-left:auto;width:80px;height:26px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#ff7b6b,#c4271b);box-shadow:0 4px 0 #6a120b}
.jpbar{display:flex;justify-content:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.jpbar span{padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid var(--c);font-weight:800;font-size:13px;color:#ffe08a}
.fsbadge{position:absolute;left:50%;top:-14px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:linear-gradient(180deg,#ff5fa2,#b0186a);font-weight:900;font-size:14px;z-index:3;box-shadow:0 0 18px rgba(255,80,160,.7);white-space:nowrap}
.machine{min-height:100%;padding:calc(var(--st) + 14px) 0 calc(var(--sb) + 290px);background:radial-gradient(ellipse at 50% 0,rgba(40,40,90,.35),transparent 60%),#000}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 14px;margin-bottom:14px;gap:10px}
.mhead .circbtn{margin:0;width:64px;height:64px}
.mtitle{padding:8px 26px;text-align:center}
.mtitle b{display:block;font-size:22px}
.mtitle small{color:#b8b8bd;font-size:15px;font-weight:600}
.mpanel{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 10px);z-index:160;border-radius:38px;padding:18px;max-width:600px;margin:0 auto}
.mpanel .row1{display:flex;align-items:center;gap:10px}
.mpanel .g small{color:var(--mut);font-size:14px}
.mpanel .g{min-width:0}.mpanel .g b{display:block;white-space:nowrap;font-size:24px;font-weight:800;letter-spacing:-.5px}
.mpanel .g em{font-style:normal;font-size:13px;color:var(--mut)}
.stake{display:flex;align-items:center;gap:6px;margin-left:auto}
.stake .rb{width:52px;height:52px;border-radius:50%;background:#2c2c30;border:1px solid var(--line2);display:grid;place-items:center;font-size:26px;font-weight:300}
.stake .sv{text-align:center;min-width:86px}
.stake .sv small{color:var(--mut);font-size:13px}
.stake .sv b{display:block;font-size:22px}
.side{display:flex;gap:10px;margin-top:12px}
.side button{flex:1;justify-content:center;padding:10px 14px;border-radius:999px;background:#2a2a2e;border:1px solid var(--line2);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.side button.on{background:linear-gradient(180deg,#6a3ab0,#3d1a72);border-color:#a370ff;box-shadow:0 0 14px rgba(160,100,255,.5)}
.side button.allin.on{background:linear-gradient(180deg,#e0552f,#9b2410);border-color:#ff8a5c}
#spinBtn{margin-top:14px;font-size:22px;padding:18px}
#spinBtn.spinning{opacity:.75}

/* ---------- wheel ---------- */
.wheelwrap{position:relative;width:min(84vw,420px);aspect-ratio:1;margin:18px auto 22px}
.wheelwrap canvas{width:100%;height:100%;transition:transform 5.2s cubic-bezier(.12,.75,.1,1)}
.wheelpin{position:absolute;left:50%;top:-14px;width:36px;height:56px;margin-left:-18px;z-index:2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}

/* ---------- lose ---------- */
.ticket{position:relative;border-radius:var(--r);padding:16px;margin-bottom:22px;background:#0f0f10;border:1px solid var(--line)}
.tk{user-select:none;-webkit-user-select:none;--a:#c7834e;--b:#e7b88a;position:relative;border-radius:22px;padding:22px 20px 18px;overflow:hidden;background:repeating-conic-gradient(from 0deg at 50% 22%,rgba(255,255,255,.1) 0 7deg,transparent 7deg 14deg),radial-gradient(circle at 50% 22%,var(--b),var(--a) 75%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.tk:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.6px);background-size:16px 16px;pointer-events:none}
.tk>*{position:relative}
.tk .brand{display:inline-block;padding:8px 18px;border-radius:999px;background:rgba(0,0,0,.25);font-weight:900;letter-spacing:4px;font-size:15px;color:#fff}
.tk .brand em{font-style:normal;color:#f3cf63}
.tk .price{position:absolute;right:18px;top:18px;padding:16px 20px;border-radius:999px;background:radial-gradient(circle at 40% 30%,#fff,#d7d2c8);color:#1b1b1b;font-weight:900;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tk .emb{width:96px;height:96px;border-radius:50%;margin:18px auto 0;background:radial-gradient(circle at 40% 30%,#fffdf6,#e9e2d1);display:grid;place-items:center;font-size:46px;box-shadow:0 6px 18px rgba(0,0,0,.25),0 0 0 6px rgba(255,255,255,.25)}
.tk .emb svg{width:46px;height:46px;stroke:var(--a);stroke-width:2.2}
.tk h3{text-align:center;font-size:clamp(28px,8.6vw,56px);overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;font-weight:900;letter-spacing:-2px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.2);margin-top:4px;line-height:1.05}
.burst{position:absolute;right:6px;top:110px;width:150px;height:110px;display:grid;place-items:center;transform:rotate(8deg);text-align:center;color:#2b1f00;font-weight:900;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.burst:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ffe58a,#f0c437);clip-path:polygon(50% 0,58% 18%,75% 6%,74% 26%,95% 22%,84% 40%,100% 52%,82% 60%,92% 80%,72% 76%,66% 96%,52% 82%,38% 98%,32% 78%,10% 84%,20% 62%,0 50%,18% 40%,6% 20%,28% 24%,26% 4%,42% 18%)}
.burst small{position:relative;display:block;font-size:12px;letter-spacing:2px}
.burst b{position:relative;display:block;font-size:22px}
.tk.dark .burst:before{background:radial-gradient(circle,#d8d0b4,#a79f86)}
.scrz{margin-top:18px;background:#fbf8f0;border-radius:22px;padding:14px;border:2px dashed rgba(0,0,0,.18);box-shadow:inset 0 0 0 6px #fbf8f0}
.tk.dark .scrz{background:#c9c9c9;box-shadow:inset 0 0 0 6px #c9c9c9}
.scrz .lab{text-align:center;font-weight:800;letter-spacing:4px;font-size:14px;color:#555;margin:2px 0 10px}
.scrz .grid{display:grid;gap:12px}
.scrz .grid.g3{grid-template-columns:repeat(3,1fr)}
.scrz .grid.g2{grid-template-columns:repeat(2,1fr)}
.scrz .grid.g4{grid-template-columns:repeat(4,1fr)}
.sc{position:relative;border-radius:14px;background:#fff;aspect-ratio:1.1;display:grid;place-items:center;overflow:hidden;color:#222;font-weight:900;font-size:clamp(15px,4.6vw,24px);text-align:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.g2 .sc{aspect-ratio:3.6}
.g4 .sc{aspect-ratio:.8;font-size:clamp(13px,3.8vw,19px)}
.sc small{display:block;font-size:.62em;color:#777;margin-top:3px}
.sc .sym{font-size:1.8em}
.sc canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .45s}
.sc canvas.gone{opacity:0;pointer-events:none}
.sc.hit{background:radial-gradient(circle,#fff6c8,#ffd75a);animation:cellwin .9s ease-in-out infinite;box-shadow:0 0 0 3px #e9a90f,0 0 20px #ffcc33}
.tk .rule{margin-top:16px;padding:14px;border-radius:999px;background:rgba(0,0,0,.25);text-align:center;font-weight:800;font-size:clamp(16px,4.6vw,22px);color:#fff}
.tk .foot{display:flex;align-items:center;gap:14px;margin-top:16px}
.tk .barcode{flex:1;height:38px;border-radius:6px;background:#fff repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 8px,#111 8px 11px,transparent 11px 12px);border:4px solid #fff}
.tk .nr{font-family:"Courier New",monospace;font-size:13px;font-weight:700;color:rgba(255,255,255,.8);line-height:1.4}
.tk .nr small{display:block;font-family:inherit;font-weight:500;opacity:.8}
.tkbar{display:flex;gap:10px;margin-top:14px;align-items:center}
.tkbar .lockinfo{flex:1}
.tklocked .tk{filter:grayscale(1) brightness(.55)}
.tkres{text-align:center;font-weight:900;font-size:22px;margin-top:12px;min-height:28px}

/* ---------- wetten ---------- */
.match .tm{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin-bottom:16px}
.match .tm .n{min-width:0;font-size:clamp(16px,4.8vw,21px);font-weight:700;display:flex;align-items:center;gap:10px;line-height:1.2}
.match .tm .n.r{justify-content:flex-end;text-align:right}
.dot{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 3px rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.06)}
.match .vs{color:var(--mut);font-size:17px}
.odds{display:grid;grid-template-columns:1fr 1fr 1fr 64px;gap:10px}
.odd{padding:10px 4px;border-radius:24px;background:#1a1a1d;border:1px solid var(--line2);text-align:center;transition:.2s var(--ease)}
.odd small{display:block;color:#aaa;font-size:15px}
.odd b{font-size:24px}
.odd.on{background:linear-gradient(180deg,#f4d77d,#c29a30);color:#1d1503;border-color:#f4d77d}
.odd.on small{color:#4b3a0a}
.odd.plus{display:grid;place-items:center;font-size:30px;font-weight:300}
.score{font-size:30px;font-weight:900;text-align:center;min-width:80px}
.live{color:var(--red);font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;justify-content:center}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);animation:bulb 1s infinite}
.betslip .sel{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}

/* ---------- börse ---------- */
.mkts{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.mkts::-webkit-scrollbar{display:none}
.mkt{flex:none;width:210px;padding:16px 18px;border-radius:22px;background:#1a2a1c;border:2px solid transparent;font-family:"Courier New",ui-monospace,monospace;display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left}
.mkt.dn{background:#2a1a1a}
.mkt.on{border-color:#e8e8e8}
.mkt b{font-size:24px;letter-spacing:1px;font-family:-apple-system,system-ui,sans-serif;font-weight:800}
.mkt .p{text-align:right;font-size:18px;font-weight:700;letter-spacing:1px}
.mkt small{color:#9a9a9a;letter-spacing:2px;font-size:14px}
.mkt .c{text-align:right;font-size:16px;font-weight:700}
.tfs{display:inline-flex;background:#1d1d20;border-radius:999px;padding:4px;margin:12px 0}
.tfs button{padding:9px 16px;border-radius:999px;color:#9a9a9f;font-weight:700;font-size:16px}
.tfs button.on{background:#3a3a3f;color:#fff}
#chart{width:100%;height:330px;display:block}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tb{padding:16px;border-radius:24px;text-align:center;color:#fff;transition:transform .12s}
.tb:active{transform:scale(.97)}
.tb small{font-size:16px;letter-spacing:1px}
.tb b{display:block;font-size:clamp(24px,7vw,34px);font-weight:800}
.tb.s{background:linear-gradient(180deg,#d65446,#a83226)}
.tb.b{background:linear-gradient(180deg,#4a86e8,#2457c4)}
.lotrow{display:flex;align-items:center;gap:10px}
.lotrow .rb{width:50px;height:50px;border-radius:50%;background:#2a2a2e;font-size:26px;flex:none}
.qch{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.qch button,.three button{padding:12px;border-radius:999px;background:#232327;border:1px solid var(--line2);font-weight:700;font-size:17px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl2{color:var(--mut);font-size:16px;margin:16px 4px 8px}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#aaa 50%),linear-gradient(135deg,#aaa 50%,transparent 50%);background-position:calc(100% - 26px) 50%,calc(100% - 19px) 50%;background-size:7px 7px;background-repeat:no-repeat}
.acct{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.acct small{display:block;color:var(--mut);letter-spacing:2px;font-size:13px}
.acct b{font-size:20px}
.ptable{overflow-x:auto;margin-top:12px}
.ptable table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
.ptable th{color:var(--mut);font-weight:600;text-align:left;padding:8px 6px}
.ptable td{padding:10px 6px;border-top:1px solid var(--line)}
.empty{text-align:center;color:var(--mut);padding:26px 0;font-size:17px}

/* ---------- spiele ---------- */
.energy{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;font-size:24px;font-weight:800}
.warn{border-color:rgba(232,82,74,.45);background:linear-gradient(180deg,#1a0f0f,#0d0d0f)}
.warn h4{color:#ff9f97;font-size:21px}
.task{background:#1a1a1d;border-radius:22px;padding:18px;margin-top:12px}
.task .row{justify-content:space-between}
.task b{font-size:18px}
.task .bar{margin:14px 0}
.task.done{opacity:.55}
.pots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.pot{position:relative;width:86px;height:110px;margin:0 auto;border-radius:20px 20px 44px 44px;background:#222;overflow:hidden;border:3px solid #2a2a2a}
.pot:before{content:"";position:absolute;top:-2px;left:50%;width:30px;height:12px;margin-left:-15px;background:#6a5428;border-radius:0 0 6px 6px;z-index:2}
.pot i{position:absolute;left:0;right:0;bottom:0;height:65%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:28px;color:rgba(255,255,255,.85)}
.pot.p2 i{background:linear-gradient(180deg,#7ad07a,#4fb54f);box-shadow:0 0 22px #4fb54f}
.pot.p4 i{background:linear-gradient(180deg,#5fa0f5,#2e74e6);box-shadow:0 0 22px #2e74e6}
.pot.p6 i{background:linear-gradient(180deg,#c487f0,#9a4fe0);box-shadow:0 0 22px #9a4fe0}
.pots b{display:block;font-size:26px;margin:10px 0}
.gm{display:block;width:100%;text-align:left}
.gm .ibox{width:76px;height:76px;border-radius:22px}
.gm h4{font-size:25px;margin-top:18px}
.gm p{color:#b0b0b6;font-size:18px;margin:6px 0 14px}
.neu{position:absolute;right:20px;top:20px;padding:6px 14px;border-radius:999px;background:#e8c43e;color:#1d1503;font-weight:900;letter-spacing:2px;font-size:15px}
.game-ov{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;animation:zoomIn .4s var(--ease)}
.game-ov .gh{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st) + 12px) 16px 10px;gap:10px}
.game-ov .gh b{font-size:22px}
.game-ov .gbody{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.game-ov canvas{touch-action:none}
.hud{display:flex;gap:10px;justify-content:center}
.hud span{padding:10px 18px;border-radius:999px;background:#1d1d20;font-weight:800;font-size:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px;margin-top:22px}
.opts button{padding:20px;border-radius:24px;background:#1f1f22;border:1px solid var(--line2);font-size:24px;font-weight:800;transition:.15s}
.opts button.ok{background:#1f4a28;border-color:var(--green)}
.opts button.no{background:#4a1f1f;border-color:var(--red)}
.money{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:440px;min-height:180px;align-content:center}
.coin{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;color:#3b2a00;background:radial-gradient(circle at 35% 30%,#ffe9a0,#c9962a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 4px 8px rgba(0,0,0,.4);animation:pop .4s var(--spring) both}
.coin.cu{background:radial-gradient(circle at 35% 30%,#ffc59a,#b0602a);color:#3a1700}
.coin.bi{background:radial-gradient(circle at 35% 30%,#f1f1f1,#9a9a9a);color:#222;border:5px solid #d6a93a}
.note{width:100px;height:54px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;box-shadow:0 4px 8px rgba(0,0,0,.4);animation:pop .4s var(--spring) both}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;width:100%;padding:16px;border-radius:24px;background:linear-gradient(180deg,#2a1d10,#1a1209);border:3px solid #4a3218}
.shelf span{font-size:40px;text-align:center;animation:pop .35s var(--spring) both}
.cups{position:relative;width:min(92vw,420px);height:220px}
.cup{position:absolute;bottom:20px;width:110px;height:130px;transition:left .35s cubic-bezier(.45,0,.55,1),transform .4s var(--spring);cursor:pointer}
.cup svg{width:100%;height:100%}
.cup.up{transform:translateY(-70px)}
.ball{position:absolute;bottom:22px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8f7a,#c2281b);transition:left .35s}
.result{text-align:center;animation:fadeUp .5s var(--ease)}
.result h2{font-size:40px;font-weight:900}
.result p{color:var(--mut);font-size:18px;margin:8px 0 22px}

/* ---------- imperium ---------- */
.shop{display:flex;align-items:center;gap:14px}
.shop .em{font-size:40px;width:64px;height:64px;border-radius:18px;background:#1f1f22;display:grid;place-items:center;flex:none}
.shop .inf{flex:1;min-width:0}
.shop .inf b{font-size:19px}

const rnd = (a, b) => a + Math.random() * (b - a);

const r2 = v => Math.round(v * 100) / 100;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NF2 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function fmt(v, opt = {}) {
  const neg = v < 0, a = Math.abs(v);

  if (a >= 1e9) s = NF2.format(a / 1e9) + ' Mrd.';
  else if (a >= 1e6) s = NF2.format(a / 1e6) + ' Mio.';
  else if (opt.int && a >= 100) s = NF0.format(a);
  else s = NF2.format(a);
  return (neg ? MINUS : (opt.sign && v > 0 ? '+' : '')) + s + ' €';
}
const fmtInt = v => (v < 0 ? MINUS : '') + (Math.abs(v) >= 1e6 ? fmt(Math.abs(v)).replace(' €', '') : NF0.format(Math.abs(v))) + ' €';

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const icon = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24">${IC[n] || ''}</svg>`;

/* ================= Sound ================= */
const SND = {
  ctx: null,
  get on() { return !S || S.set.snd !== false; },
  c() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  tone(f, d = .1, type = 'sine', v = .15, when = 0, slide = 0) {
    if (!this.on) return; const c = this.c(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .02);
  },
  noise(d = .2, v = .1, when = 0, f = 2000) {
    if (!this.on) return; const c = this.c(); if (!c) return;
    const b = c.createBuffer(1, c.sampleRate * d, c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / a.length);
    const s = c.createBufferSource(), g = c.createGain(), fl = c.createBiquadFilter();
    fl.type = 'bandpass'; fl.frequency.value = f; s.buffer = b; g.gain.value = v;
    s.connect(fl).connect(g).connect(c.destination); s.start(c.currentTime + when);
  },
  click() { this.tone(1800, .03, 'square', .04); },
  tick() { this.tone(2400, .02, 'square', .03); },
  stop() { this.tone(160, .08, 'triangle', .2); this.noise(.06, .08, 0, 900); },
  coin(i = 0) { this.tone(1320 + i * 90, .12, 'square', .05); this.tone(1980 + i * 90, .18, 'square', .04, .05); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .22, 'triangle', .12, i * .09)); },
  big() { [392, 523, 659, 784, 1047, 1319, 1568].forEach((f, i) => { this.tone(f, .35, 'sawtooth', .06, i * .1); this.tone(f * 2, .3, 'triangle', .07, i * .1); }); this.noise(.8, .05, .7, 6000); },
  lose() { this.tone(300, .25, 'triangle', .1, 0, 180); },
  scratch() { this.noise(.05, .05, 0, 5000); },
  err() { this.tone(200, .15, 'square', .06); this.tone(150, .2, 'square', .06, .1); },
};
const vib = p => { try { if (S && S.set.vib !== false && navigator.vibrate) navigator.vibrate(p); } catch (e) { } };

/* ================= FX: Konfetti, Münzen ================= */
const FX = {
  cv: null, cx: null, ps: [], run: false,
  init() { this.cv = $('#fx'); this.cx = this.cv.getContext('2d'); const rs = () => { this.cv.width = innerWidth * devicePixelRatio; this.cv.height = innerHeight * devicePixelRatio; }; rs(); addEventListener('resize', rs); },
  burst(n = 120, opts = {}) {
    const W = innerWidth, H = innerHeight, cols = opts.cols || ['#f5cf5a', '#fff2b8', '#e8524a', '#4cc265', '#3b7be0', '#c487f0', '#ffffff'];
    for (let i = 0; i < n; i++) {
      const coin = opts.coins && Math.random() < .55;
      this.ps.push({
        x: opts.x ?? W / 2 + rnd(-40, 40), y: opts.y ?? H * .45, vx: rnd(-1, 1) * (opts.spread || 11), vy: rnd(-18, -6) * (opts.power || 1),
        g: .42, r: coin ? rnd(9, 15) : rnd(4, 8), rot: rnd(0, 6.28), vr: rnd(-.3, .3), c: pick(cols), coin, life: rnd(110, 190), shape: rint(0, 2)
      });
    }
    if (!this.run) { this.run = true; requestAnimationFrame(() => this.loop()); }
  },
  rain(n = 80, dur = 2500) {
    const W = innerWidth; let made = 0; const iv = setInterval(() => {
      for (let i = 0; i < 6; i++) { this.ps.push({ x: rnd(0, W), y: -20, vx: rnd(-1, 1), vy: rnd(2, 6), g: .18, r: rnd(10, 16), rot: rnd(0, 6), vr: rnd(-.2, .2), c: '#f5cf5a', coin: true, life: 260 }); made++; }
      if (made > n) clearInterval(iv);
    }, dur / (n / 6));
    if (!this.run) { this.run = true; requestAnimationFrame(() => this.loop()); }
  },
  loop() {
    const c = this.cx, d = devicePixelRatio; c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, innerWidth, innerHeight);
    this.ps = this.ps.filter(p => p.life > 0 && p.y < innerHeight + 40);
    for (const p of this.ps) {
      p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.globalAlpha = Math.min(1, p.life / 30);
      if (p.coin) {
        const sx = Math.abs(Math.cos(p.rot * 2)); c.scale(Math.max(.15, sx), 1);
        const gr = c.createRadialGradient(-p.r * .3, -p.r * .3, 1, 0, 0, p.r); gr.addColorStop(0, '#fff3c0'); gr.addColorStop(.5, '#f2c447'); gr.addColorStop(1, '#a3751a');
        c.fillStyle = gr; c.beginPath(); c.arc(0, 0, p.r, 0, 6.29); c.fill(); c.strokeStyle = '#7a560f'; c.lineWidth = 1.5; c.stroke();
        c.fillStyle = '#8a6514'; c.font = `900 ${p.r}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('€', 0, 1);
      } else {
        c.fillStyle = p.c;
        if (p.shape === 0) c.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
        else if (p.shape === 1) { c.beginPath(); c.arc(0, 0, p.r / 1.5, 0, 6.29); c.fill(); }
        else { c.beginPath(); c.moveTo(0, -p.r); c.lineTo(p.r, p.r); c.lineTo(-p.r, p.r); c.fill(); }
      }
      c.restore();
    }
    if (this.ps.length) requestAnimationFrame(() => this.loop()); else { this.run = false; c.clearRect(0, 0, innerWidth, innerHeight); }
  }
};
function countUp(el, from, to, ms, f = fmt) {
  return new Promise(res => {
    const t0 = performance.now(); let lastTick = 0;
    const st = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = f(from + (to - from) * e); if (t - lastTick > 70 && k < 1) { SND.tick(); lastTick = t; } if (k < 1) requestAnimationFrame(st); else res(); };
    requestAnimationFrame(st);
  });
}
function flash() { const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 800); }
function shake(el = document.body) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 700); }
/* Gewinn feiern: mult = Gewinn / Einsatz */
function celebrate(amount, mult, label) {
  if (amount <= 0) return Promise.resolve();
  if (mult < 10) {
    SND.win(); vib(30);
    FX.burst(mult >= 3 ? 70 : 30, { coins: true, power: .8 });
    return Promise.resolve();
  }
  let tier = mult >= 200 ? 'EPIC WIN' : mult >= 50 ? 'MEGA WIN' : 'BIG WIN';
  if (label) tier = label;
  return new Promise(res => {
    flash(); shake($('#app')); SND.big(); vib([60, 40, 120, 40, 200]);
    const o = document.createElement('div'); o.id = 'bigwin'; if (mult >= 200 || label) o.className = 'epic';
    o.innerHTML = `<div class="rays"></div><div class="bw-t">${tier.replace(' ', '<br>')}</div><div class="bw-a num">0,00 €</div><div class="bw-s">Tippen zum Fortfahren</div>`;
    document.body.appendChild(o);
    FX.burst(160, { coins: true, power: 1.2 }); FX.rain(mult >= 50 ? 160 : 80, 2600);
    const iv = setInterval(() => FX.burst(40, { x: rnd(40, innerWidth - 40), y: rnd(100, innerHeight * .5) }), 600);
    let done = false;
    const fin = () => { if (done) return; done = true; clearInterval(iv); o.style.transition = 'opacity .4s'; o.style.opacity = 0; setTimeout(() => { o.remove(); res(); }, 400); };
    countUp($('.bw-a', o), 0, amount, mult >= 50 ? 3200 : 2200).then(() => { SND.coin(5); setTimeout(fin, 2600); });
    setTimeout(() => o.onclick = fin, 500);
  });
}

/* ================= Toast / Sheets ================= */
function toast(msg, kind = '', ms = 3200) {
  const t = document.createElement('div'); t.className = 'toast ' + kind;
  t.innerHTML = `<div class="ti">${kind === 'good' ? '✓' : kind === 'bad' ? '!' : 'i'}</div><div>${msg}</div>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, ms);
}
function sheet(html, opts = {}) {
  const o = document.createElement('div'); o.className = 'ov' + (opts.center ? ' center' : '');

function teaseFrom(m, g) {
  if (m.t === 'v') {
    let sc = 0; for (let x = 0; x < 5; x++) { if (sc >= 2) return x; sc += g[x].filter(s => s === m.scat).length; }
    return 99;
  }
  // nur waagerecht: gleiche Reihe auf Walze 1 und 2 – egal welches Symbol
  for (let r = 0; r < 3; r++) if (g[0][r] === g[1][r]) return 2;
  return 99;
}

function foil(sc, onReveal) {

<script>

  DNR: { n: 'Döner AG', k: 'AKTIE', base: 81, vol: .025, lev: 5, cs: 10, sp: .0012, dec: 2 },

  $('#oty', el).value = bxUI.ty; $('#opx', el).classList.toggle('hidden', bxUI.ty === 'M');
  const cv = $('#chart', el);
  const getLot = () => Math.max(.01, Math.round((+String($('#lot', el).value).replace(',', '.') || .01) * 100) / 100);
  const num = id => { const v = +String($(id, el).value).replace(',', '.'); return v > 0 ? v : 0; };

    $('#pBid', el).textContent = pf(sym, q.bid); $('#pAsk', el).textContent = pf(sym, q.ask); $('#pSp', el).textContent = 'Spread ' + pf(sym, q.sp);

    else if (bxUI.tab === 1) tb.innerHTML = B.ord.length ? `<table><tr><th>#</th><th>Symbol</th><th>Typ</th><th>Lot</th><th>Preis</th><th></th></tr>${B.ord.map(o => `<tr><td>${o.id}</td><td>${o.sym}</td><td>${o.dir > 0 ? 'Buy' : 'Sell'} ${o.ty === 'L' ? 'Limit' : 'Stop'}</td><td>${o.lot}</td><td>${pf(o.sym, o.px)}</td><td><button class="btn xs dark" data-co="${o.id}">✕</button></td></tr>`).join('')}</table>` : '<div class="empty">Keine Orders</div>';
    else tb.innerHTML = B.hist.length ? `<table><tr><th>#</th><th>Symbol</th><th>Typ</th><th>Lot</th><th>Eröffnung</th><th>Schluss</th><th>Grund</th><th>G/V</th></tr>${B.hist.map(h => `<tr><td>${h.id}</td><td>${h.sym}</td><td>${h.dir > 0 ? 'Long' : 'Short'}</td><td>${h.lot}</td><td>${pf(h.sym, h.op)}</td><td>${pf(h.sym, h.cl)}</td><td>${h.why}</td><td class="${h.pl >= 0 ? 'pos' : 'neg'}">${h.pl >= 0 ? '+' : ''}${NF2.format(h.pl)}</td></tr>`).join('')}</table>` : '<div class="empty">Noch keine Trades</div>';
    drawChart(cv, sym, B.tf);
  };
  $('#mkts', el).onclick = e => { const b = e.target.closest('[data-s]'); if (b) { B.sym = b.dataset.s; bxUI.sl = bxUI.tp = ''; $('#sl', el).value = $('#tp', el).value = ''; SND.click(); save(); draw(); } };
  $('#tfs', el).onclick = e => { const b = e.target.closest('[data-tf]'); if (!b) return; B.tf = b.dataset.tf; $$('#tfs button', el).forEach(x => x.classList.toggle('on', x === b)); SND.click(); save(); draw(); };
  $('#lM', el).onclick = () => { $('#lot', el).value = Math.max(.01, r2(getLot() - (getLot() > 1 ? 1 : getLot() > .1 ? .1 : .01))); bxUI.lot = getLot(); draw(); };
  $('#lP', el).onclick = () => { $('#lot', el).value = r2(getLot() + (getLot() >= 1 ? 1 : getLot() >= .1 ? .1 : .01)); bxUI.lot = getLot(); draw(); };
  $('#lot', el).oninput = () => { bxUI.lot = getLot(); };
  $('#lq', el).onclick = e => { const b = e.target.closest('[data-v]'); if (b) { $('#lot', el).value = b.dataset.v; bxUI.lot = +b.dataset.v; draw(); } };
  const fill = d => { const q = quote(B.sym), m = q.mid, s = SYMS[B.sym].vol * .25; $('#sl', el).value = pf(B.sym, m * (1 - d * s)).replace(/\./g, ''); $('#tp', el).value = pf(B.sym, m * (1 + d * s * 1.5)).replace(/\./g, ''); bxUI.sl = $('#sl', el).value; bxUI.tp = $('#tp', el).value; SND.click(); };
  $('#fL', el).onclick = () => fill(1); $('#fS', el).onclick = () => fill(-1); $('#fC', el).onclick = () => { $('#sl', el).value = $('#tp', el).value = ''; bxUI.sl = bxUI.tp = ''; };
  $('#sl', el).oninput = e => bxUI.sl = e.target.value; $('#tp', el).oninput = e => bxUI.tp = e.target.value;
  $('#oty', el).onchange = e => { bxUI.ty = e.target.value; $('#opx', el).classList.toggle('hidden', bxUI.ty === 'M'); };
  $('#opx', el).oninput = e => bxUI.px = e.target.value;
  $('#lev', el).onchange = e => { B.lev = +e.target.value; save(); draw(); };
  const trade = dir => {
    const lot = getLot(), sl = num('#sl'), tp = num('#tp'), q = quote(B.sym), ref = dir > 0 ? q.ask : q.bid;
    if (sl && (dir > 0 ? sl >= ref : sl <= ref)) { toast(`Stop Loss muss ${dir > 0 ? 'unter' : 'über'} dem Kurs liegen.`, 'bad'); return; }
    if (tp && (dir > 0 ? tp <= ref : tp >= ref)) { toast(`Take Profit muss ${dir > 0 ? 'über' : 'unter'} dem Kurs liegen.`, 'bad'); return; }
    if (bxUI.ty !== 'M') {
      const px = num('#opx'); if (!px) { toast('Bitte einen Auslösepreis eingeben.', 'bad'); return; }
      B.ord.push({ id: B.id++, sym: B.sym, dir, lot, ty: bxUI.ty, px, sl, tp }); save(); toast(`${bxUI.ty === 'L' ? 'Limit' : 'Stop'}-Order gesetzt ✅`, 'good'); bxUI.tab = 1; draw(); return;
    }
    if (openPos(B.sym, dir, lot, sl, tp)) { toast(`${dir > 0 ? 'Long' : 'Short'} ${lot} ${B.sym} @ ${pf(B.sym, ref)} eröffnet`, 'good'); bxUI.tab = 0; draw(); }
  };
  $('#bBuy', el).onclick = () => trade(1); $('#bSell', el).onclick = () => trade(-1);
  $('#ptabs', el).onclick = e => { const b = e.target.closest('[data-t]'); if (b) { bxUI.tab = +b.dataset.t; draw(); } };
  $('#ptab', el).onclick = e => {
    const c = e.target.closest('[data-cl]'); if (c) { const p = B.pos.find(x => x.id === +c.dataset.cl); if (p) { const pl = closePos(p); toast(`Position geschlossen: ${fmt(pl, { sign: true })}`, pl >= 0 ? 'good' : 'bad'); if (pl > 0) { SND.win(); FX.burst(30, { coins: true }); } draw(); } return; }
    const o = e.target.closest('[data-co]'); if (o) { B.ord = B.ord.filter(x => x.id !== +o.dataset.co); save(); draw(); }
  };
  $('#bxIO', el).onclick = $('#bxIO2', el).onclick = () => openKonto(true);
  draw();
  pageTimer(() => { bxTick(); if (!document.activeElement || !el.contains(document.activeElement) || document.activeElement.tagName === 'BUTTON') draw(); else { drawChart(cv, B.sym, B.tf); } }, 1000);
}
function drawChart(cv, sym, tf) {
  const d = devicePixelRatio || 1, W = cv.offsetWidth, H = cv.offsetHeight; if (!W) return;
  if (cv.width !== W * d) { cv.width = W * d; cv.height = H * d; }
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, W, H);
  const step = TFS[tf] * 1000, now = Date.now(), N = 44, cur = Math.floor(now / step) * step, cs = [];
  for (let i = N - 1; i >= 0; i--) {
    const t0 = cur - i * step, t1 = Math.min(now, t0 + step); let o = mid(sym, t0), h = o, l = o, cl = o;
    for (let k = 1; k <= 12; k++) { const v = mid(sym, t0 + (t1 - t0) * k / 12); h = Math.max(h, v); l = Math.min(l, v); cl = v; }
    cs.push({ t: t0, o, h, l, c: cl });
  }
  const q = quote(sym), PR = 82, PB = 30, cw = W - PR, ch = H - PB;
  let hi = Math.max(...cs.map(x => x.h), q.ask), lo = Math.min(...cs.map(x => x.l), q.bid); const pad = (hi - lo) * .12 || 1; hi += pad; lo -= pad;
  const Y = v => (hi - v) / (hi - lo) * ch;
  c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = 1; c.fillStyle = '#8a8a90'; c.font = '13px -apple-system,system-ui,sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
  for (let k = 0; k <= 5; k++) { const v = lo + (hi - lo) * k / 5, y = Y(v); c.beginPath(); c.moveTo(0, y); c.lineTo(cw, y); c.stroke(); c.fillText(v.toFixed(SYMS[sym].dec), cw + 8, y); }
  c.beginPath(); c.moveTo(cw, 0); c.lineTo(cw, ch); c.stroke();
  const bw = cw / N;
  cs.forEach((x, i) => {
    const cx = i * bw + bw / 2, up = x.c >= x.o; c.strokeStyle = c.fillStyle = up ? '#4cc265' : '#e8524a';
    c.beginPath(); c.moveTo(cx, Y(x.h)); c.lineTo(cx, Y(x.l)); c.stroke();
    const y1 = Y(Math.max(x.o, x.c)), y2 = Y(Math.min(x.o, x.c)); c.fillRect(cx - bw * .32, y1, bw * .64, Math.max(1.5, y2 - y1));
    if (i % 11 === 0) { const dt = new Date(x.t); c.fillStyle = '#8a8a90'; c.textAlign = 'center'; c.fillText(tf === 'D1' ? dt.getDate() + '.' + (dt.getMonth() + 1) + '.' : String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0'), cx, ch + 16); c.textAlign = 'left'; }
  });
  [[q.bid, '#e8524a', '#fff'], [q.ask, '#fff', '#111']].forEach(([v, bg, fg], k) => {
    const y = Y(v); c.setLineDash([4, 4]); c.strokeStyle = k ? 'rgba(255,255,255,.35)' : '#e8524a'; c.beginPath(); c.moveTo(0, y); c.lineTo(cw, y); c.stroke(); c.setLineDash([]);
    c.fillStyle = bg; c.fillRect(cw + 2, y - 11 + (k ? -12 : 10), PR - 2, 22); c.fillStyle = fg; c.font = '600 13px -apple-system,system-ui,sans-serif'; c.fillText(v.toFixed(SYMS[sym].dec), cw + 8, y + (k ? -12 : 10));
  });
  S.bx.pos.filter(p => p.sym === sym).forEach(p => { const y = Y(p.op); c.strokeStyle = p.dir > 0 ? '#3b7be0' : '#e8a24a'; c.setLineDash([2, 3]); c.beginPath(); c.moveTo(0, y); c.lineTo(cw, y); c.stroke(); c.setLineDash([]); c.fillStyle = c.strokeStyle; c.fillText(`#${p.id} ${p.dir > 0 ? 'Long' : 'Short'}`, 6, y - 9); });
}

<script>
/* ===== spiele.js ===== */
'use strict';
/* ================= Aufgaben ================= */
const TASKS_D = [['trades', 3, 'Schließ {g} Trades'], ['shifts', 2, 'Erledige {g} Schichten'], ['wager', 90, 'Setz insgesamt {g} €'], ['spins', 40, 'Dreh {g}-mal am Automaten'], ['scratch', 5, 'Rubbel {g} Lose'], ['bets', 2, 'Platziere {g} Wetten'], ['rounds', 80, 'Spiel {g} Runden']];
function mkTasks(seed, mult, money, xp) {
  const r = mulberry(seed), pool = [...TASKS_D].sort(() => r() - .5).slice(0, 3);
  return pool.map(([k, g, n]) => { const goal = k === 'wager' ? Math.round(g * S.level * mult) : g * mult; return { k, g: goal, n: n.replace('{g}', NF0.format(goal)), p: 0, rew: r2(base() * money), xp: Math.round(xp), done: false }; });
}
function ensureTasks() {
  const d = dayKey(), w = weekKey();
  if (!S.tasks) S.tasks = {};
  if (S.tasks.d !== d) { S.tasks.d = d; S.tasks.day = mkTasks(hashStr(d + ACC), 1, 2.67, 14 + S.level * 14); }
  if (S.tasks.w !== w) { S.tasks.w = w; S.tasks.week = mkTasks(hashStr(w + ACC + 'w'), 6, 8.7, 240); }
}
function hashStr(s) { let h = 7; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 2654435761); return h >>> 0; }
function taskProg(k, v) {
  if (!S) return; ensureTasks();
  [...S.tasks.day, ...S.tasks.week].forEach(t => {
    if (t.k !== k || t.done) return; t.p = Math.min(t.g, t.p + v);
    if (t.p >= t.g) { t.done = true; whenFree(() => setTimeout(() => { earn(t.rew, 'Aufgabe'); addXP(t.xp); toast(`Aufgabe erledigt: ${t.n} → +${fmt(t.rew)} · ${t.xp} XP ✅`, 'good', 4000); SND.win(); FX.burst(50); hdr(true); save(); }, 600)); }
  });
}
function tasksHTML(list) {
  return list.map(t => `<div class="task ${t.done ? 'done' : ''}"><div class="row sb"><b>${t.n}</b><span class="num" style="color:var(--mut)">${NF0.format(t.p)} / ${NF0.format(t.g)}</span></div><div class="bar"><i style="width:${t.p / t.g * 100}%"></i></div><span class="chip gold">${t.done ? '✓ ' : '+'}${fmt(t.rew)} · ${t.xp} XP</span></div>`).join('');
}
function untilMidnight() { const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); const s = (m - n) / 1000; return `${Math.floor(s / 3600)} Std. ${Math.floor(s % 3600 / 60)} Min.`; }

/* ================= Glückstränke ================= */
const POT_R = { 2: 10, 4: 6, 6: 4 };
const potCap = () => r2(base() * 1.5);
function potionsHTML() {
  return `<div class="pots">${[2, 4, 6].map(m => `<div><div class="pot p${m}"><i>×${m}</i></div><b class="num">${S.pot[m]}×</b><button class="btn dark sm w" data-drink="${m}" ${S.pot[m] < 1 || S.potAct ? 'disabled' : ''}>Trinken</button></div>`).join('')}</div>`;
}
function bindPotions(root, cb) {
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-drink]'); if (!b) return; const m = +b.dataset.drink;
    if (S.potAct) { toast('Es wirkt schon ein Glückstrank.'); return; }
    if (S.pot[m] < 1) return;
    S.pot[m]--; S.potAct = { m, left: POT_R[m] }; S.st.potsDrunk++;
    SND.big(); flash(); FX.burst(80, { cols: m === 2 ? ['#7ad07a', '#fff'] : m === 4 ? ['#5fa0f5', '#fff'] : ['#c487f0', '#fff'] });
    toast(`Glückstrank ×${m} wirkt für ${POT_R[m]} Runden ✨`, 'good'); checkAch(); save(); cb && cb();
  });
}

/* ================= Seite: Minispiele ================= */
function renderSpiele(el) {
  regenEnergy(); ensureTasks();
  const nextE = S.energy < 10 ? Math.ceil((S.enTs + 600e3 - Date.now()) / 60e3) : 0;
  el.innerHTML = `<h1 class="t">Minispiele</h1><p class="sub">Aufgaben erledigen, Geld zurückholen, Glückstränke brauen</p>
   <div class="pill energy">${icon('battery')} <span class="num">${S.energy} / 10</span>${nextE ? `<small style="font-size:14px;color:var(--mut);font-weight:600">+1 in ${nextE} Min.</small>` : ''}</div>
   ${S.bal < 0 ? `<div class="card warn" style="margin-top:18px"><div class="row" style="align-items:flex-start">${icon('warn')}<div><h4>Du bist im Minus (${fmt(S.bal)})</h4><p class="hint" style="font-size:18px;margin:6px 0 0;color:#cfcfd4">Jedes Minispiel zahlt zuerst deine Schulden ab. ${isLocked() ? 'Dein Konto ist gesperrt, bis du wieder über dem Dispo bist.' : ''}</p></div></div></div>` : ''}
   <div class="sec">Aufgaben <small>neue Tagesaufgaben in ${untilMidnight()}</small></div>
   <div class="card"><h3 style="font-size:24px">Heute</h3>${tasksHTML(S.tasks.day)}</div>
   <div class="card"><h3 style="font-size:24px">Diese Woche</h3>${tasksHTML(S.tasks.week)}</div>
   <div class="sec">Glückstränke ${S.potAct ? `<small class="goldc">×${S.potAct.m} aktiv · noch ${S.potAct.left} Runden</small>` : ''}</div>
   <div class="card" id="potCard">${potionsHTML()}
     <p style="font-size:19px;line-height:1.45;margin:20px 4px 10px">Ein Glückstrank lässt Drehs am Automaten und Rubbellose mehrmals würfeln – du bekommst das beste Ergebnis. ×2 wirkt 10 Runden, ×4 6 Runden, ×6 4 Runden – und nur bis ${fmt(potCap())} Einsatz. Bei All-In wirkt er nicht.</p>
     <p class="hint" style="font-size:17px">Brauen ist schwer: Stopp den Regler im grünen Bereich – 6 Treffer für ×2, 8 für ×4, 10 für ×6. Bester Lauf bisher: ${S.brewBest}.</p>
     <button class="btn white w" id="lab" style="font-size:22px">${icon('spark')} Glückslabor · 2 Energie</button></div>
   <div class="sec">Geld verdienen</div>
   ${[['hut', 'target', 'Hütchenspiel', 'Behalt die Kugel im Auge.', 1], ['kasse', 'hand', 'Kassensturz', 'Zähl die Kasse schneller als der Chef.'], ['pfand', 'beer', 'Pfandflaschen', 'Fang die Flaschen, meide die Scherben.'], ['inv', 'layers', 'Inventur', 'Merk dir das Regal – dann wird gezählt.']].map(([id, ic, n, d, neu]) => `<button class="card gm" data-g="${id}" style="position:relative">${neu ? '<span class="neu">NEU</span>' : ''}<div class="ibox">${icon(ic)}</div><h4>${n}</h4><p>${d}</p><span class="chip gold">bis ${fmt(base())} · 1 Energie</span></button>`).join('')}
   <p class="hint">Perfekte Spiele haben eine kleine Chance auf einen Glückstrank ×2.</p>
   <div class="sec">Imperium</div>
   <button class="card gm row" id="imp" style="display:flex;gap:16px;align-items:center"><div class="ibox">${icon('building')}</div><div style="flex:1"><h4 style="margin:0">Eigene Geschäfte</h4><p style="margin:6px 0 0">Kauf Kiosk, Späti, Hotel … – sie bringen jede Stunde Geld, auch wenn du offline bist.</p></div><b class="pos num" style="font-size:22px;white-space:nowrap">${fmt(shopRate())}/h</b>${icon('right', 'chev')}</button>`;
  bindPotions($('#potCard', el), () => renderSpiele(el));

/* ================= Spiel-Rahmen ================= */
const GAMES = {

function startGame(id) {

      if (m) { SND.big(); FX.burst(100, { cols: ['#c487f0', '#5fa0f5', '#7ad07a', '#fff'] }); } else SND.lose();
    } else {

      if (score >= max) { S.st.perfect++; if (Math.random() < .05) { S.pot[2]++; potTxt = '<br>✨ Bonus: Glückstrank ×2!'; } }
      if (amt > 0) { earn(amt, G.n); FX.burst(score >= max ? 120 : 50, { coins: true }); score >= max ? SND.big() : SND.win(); } else SND.lose();
      html = `<h2>${score >= max ? 'Perfekt! 🔥' : score > 0 ? 'Gut gemacht!' : 'Schade…'}</h2><p>${score} / ${max} · +${fmt(amt)}${S.bal - amt < 0 && amt > 0 ? ' (geht zuerst an deine Schulden)' : ''}${potTxt}</p>`;

}

/* ---------- Kassensturz ---------- */
const MONEY = [[.05, 'cu', '5ct'], [.1, '', '10ct'], [.2, '', '20ct'], [.5, '', '50ct'], [1, 'bi', '1€'], [2, 'bi', '2€'], [5, 'n', '5€', '#7a8a6a'], [10, 'n', '10€', '#c04a4a'], [20, 'n', '20€', '#3a6ad0'], [50, 'n', '50€', '#e08a2a']];

/* ---------- Inventur ---------- */
function gameInv(body, done, cl, isEnded) {

/* ---------- Hütchenspiel ---------- */
function gameHut(body, done, cl, isEnded) {

  const cupSVG = '<svg viewBox="0 0 110 130"><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#7a1f14"/><stop offset=".4" stop-color="#e0553e"/><stop offset="1" stop-color="#6a160d"/></linearGradient></defs><path d="M22 10h66l18 110H4z" fill="url(#cg)"/><ellipse cx="55" cy="10" rx="33" ry="7" fill="#a33626"/><ellipse cx="55" cy="120" rx="51" ry="9" fill="#5a120a"/><rect x="10" y="90" width="90" height="8" fill="#f5cf5a" opacity=".8"/></svg>';

/* ---------- Pfandflaschen & Glückslabor (Canvas) ---------- */
function canvasGame(body, cl, isEnded, cfg) {
  body.innerHTML = `<div class="hud" id="hud"></div><canvas id="gc" style="width:min(94vw,460px);height:min(64vh,560px);margin-top:12px;border-radius:24px;background:${cfg.bg}"></canvas><p style="color:var(--mut);margin-top:10px">${cfg.help}</p>`;
  const cv = $('#gc', body), d = devicePixelRatio || 1, W = cv.offsetWidth, H = cv.offsetHeight;
  cv.width = W * d; cv.height = H * d; const c = cv.getContext('2d'); c.scale(d, d);

  const loop = t => { if (!alive || isEnded()) return; st.t = (t - st.t0) / 1000; c.clearRect(0, 0, W, H); if (cfg.step(st) === false) { alive = false; return; } $('#hud', body).innerHTML = cfg.hud(st); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);

}
function gamePfand(body, done, cl, isEnded) {
  countdown(body, () => {
    const T = 30, GOAL = 22;
    const st = canvasGame(body, cl, isEnded, {
      bg: 'linear-gradient(180deg,#14202e,#0a0f16)', help: 'Finger/Maus bewegen den Korb',
      init(s) { s.x = s.W / 2; s.items = []; s.lives = 3; s.next = 0; const mv = e => { const r = s.cv.getBoundingClientRect(); s.x = clamp(e.clientX - r.left, 40, s.W - 40); }; s.cv.addEventListener('pointermove', mv); s.cv.addEventListener('pointerdown', mv); },
      hud: s => `<span>⏱ ${Math.max(0, Math.ceil(T - s.t))}</span><span>🍾 ${s.score}/${GOAL}</span><span>${'❤️'.repeat(s.lives)}${'🖤'.repeat(3 - s.lives)}</span>`,
      step(s) {
        const c = s.c;
        if (s.t > s.next) { s.next = s.t + Math.max(.32, .9 - s.t * .02); const bad = Math.random() < .28 + s.t * .006; s.items.push({ x: rnd(25, s.W - 25), y: -30, v: rnd(2.4, 3.6) + s.t * .09, bad, e: bad ? '' : pick(['🍾', '🥤', '🧃', '🍺']), r: rnd(0, 6) }); }

          else c.fillText(it.e, it.x, it.y);

        }

  });
}
function gameLab(body, done, cl, isEnded) { countdown(body, () => labRun(body, done, cl, isEnded)); }
function labRun(body, done, cl, isEnded) {
  const GOAL = 10, TH = { 6: 2, 8: 4, 10: 6 };
  body.innerHTML = `<div class="lab">
    <div class="hud"><span id="lbS">✨ 0 / ${GOAL}</span><span id="lbP">–</span></div>
    <div class="lpips">${Array.from({ length: GOAL }, (_, i) => `<i class="${TH[i + 1] ? 'mk' : ''}" data-x="${TH[i + 1] ? '×' + TH[i + 1] : ''}"></i>`).join('')}</div>
    <div class="lbar" id="lbar"><div class="lzone" id="lz"></div><div class="lneedle" id="ln"></div></div>
    <p class="lhelp">Stopp den Regler im <b style="color:#7ad07a">grünen</b> Bereich!<br>Jeder Treffer macht ihn schneller und das Grün kleiner.</p>
    <button class="btn white w" id="lbGo" style="font-size:24px;padding:22px;max-width:440px">STOPP</button></div>`;
  const bar = $('#lbar', body), z = $('#lz', body), n = $('#ln', body);

  const loop = t => {

}

/* ================= Imperium ================= */
const SHOPS = [['kiosk', 'Kiosk', '🏪', 500, 10], ['spaeti', 'Späti', '🏬', 2500, 45], ['doener', 'Dönerbude', '🥙', 10000, 160], ['wasch', 'Waschsalon', '🧺', 40000, 560], ['bar', 'Cocktailbar', '🍸', 150000, 1900], ['hotel', 'Hotel', '🏨', 750000, 8500], ['casino', 'Casino', '🎰', 5e6, 50000], ['bank', 'Privatbank', '🏦', 4e7, 350000]];
const shopInc = (s, l) => l > 0 ? s[4] * Math.pow(1.5, l - 1) : 0;
const shopCost = (s, l) => r2(s[3] * Math.pow(1.8, l));
function shopRate() { return r2(SHOPS.reduce((a, s) => a + shopInc(s, S.shops[s[0]] || 0), 0)); }
function shopPending() { const h = Math.min(24, (Date.now() - S.shopTs) / 36e5); return r2(shopRate() * h); }
function collectShops(silent) { const p = shopPending(); S.shopTs = Date.now(); if (p > 0) { earn(p, 'Imperium'); if (!silent) { toast(`Geschäfte eingesammelt: +${fmt(p)} 🏪`, 'good'); SND.coin(); FX.burst(50, { coins: true }); } } save(); }
function renderImperium(el) {

      <button class="btn gold" id="col" ${pend <= 0 ? 'disabled' : ''}>Einsammeln<br>${fmt(pend)}</button></div></div>
    ${SHOPS.map(s => { const l = S.shops[s[0]] || 0, c = shopCost(s, l), lk = l === 0 && SHOPS.indexOf(s) > 0 && !(S.shops[SHOPS[SHOPS.indexOf(s) - 1][0]]); return `<div class="card shop" style="${lk ? 'opacity:.5' : ''}"><div class="em">${s[2]}</div><div class="inf"><b>${s[1]}</b>${l ? ` <span class="chip" style="padding:3px 10px;font-size:12px">Stufe ${l}</span>` : ''}<small>${l ? `${fmt(shopInc(s, l))}/h → ${fmt(shopInc(s, l + 1))}/h` : `bringt ${fmt(s[4])}/h`}</small></div>
      <button class="btn ${l ? 'dark' : 'white'} sm" data-s="${s[0]}" ${lk ? 'disabled' : ''}>${l ? 'Ausbauen' : 'Kaufen'}<br><span class="num" style="font-size:13px">${fmt(c)}</span></button></div>`; }).join('')}`;
  $('#back', el).onclick = () => go('spiele');
  $('#col', el).onclick = () => { collectShops(); renderImperium(el); };
  el.onclick = e => {
    const b = e.target.closest('[data-s]'); if (!b) return; const s = SHOPS.find(x => x[0] === b.dataset.s), l = S.shops[s[0]] || 0, c = shopCost(s, l);
    if (S.bal < c) { toast(`Dafür brauchst du ${fmt(c)} Guthaben (Dispo zählt nicht).`, 'bad'); SND.err(); return; }
    collectShops(true);
    S.bal = r2(S.bal - c); S.shops[s[0]] = l + 1; SND.big(); FX.burst(70); toast(l ? `${s[1]} auf Stufe ${l + 1} ausgebaut! 📈` : `${s[1]} gekauft! ${s[2]}`, 'good');
    hdr(true); checkAch(); save(); renderImperium(el);
  };
  pageTimer(() => { const b = $('#col', el); if (b) { const p = shopPending(); b.innerHTML = `Einsammeln<br>${fmt(p)}`; b.disabled = p <= 0; } }, 5000);
}

<script>

function editProfile() {

    <div class="lbl2">Profilbild</div><div class="row"><label class="btn dark sm" style="cursor:pointer">${icon('face')} Foto wählen<input type="file" accept="image/*" id="eP" hidden></label>${S.photo ? '<button class="btn dark sm" id="eR">Entfernen</button>' : ''}</div>

function openSettings() {
  const o = sheet(`<div class="row sb"><h2>Einstellungen</h2><button class="x" data-close>${icon('x')}</button></div>
    <div class="card tight list" style="margin-top:16px;background:#151517">

  $('#exp', o).onclick = async () => { persist(); const code = 'GG1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ ...S, photo: '' })))); try { await navigator.clipboard.writeText(code); toast('Spielstand-Code kopiert 📋', 'good'); } catch (e) { sheet(`<h2>Dein Code</h2><textarea class="inp" style="height:200px;font-size:12px" readonly>${code}</textarea>`, { center: true }); } };

    box.onclick = e => { const b = e.target.closest('[data-ch]'); if (!b) return; doCheat(b.dataset.ch); if (!S.cheat) box.innerHTML = `<div class="row"><input class="inp" id="cCode" placeholder="Code…" autocomplete="off"><button class="btn dark sm" id="cGo2">OK</button></div>`; bindCheat(); };

/* ================= Cheat-Menü (Code 4uT2-U6G3) ================= */
const CHEATS = [['m1', '💰 +1.000 €'], ['m2', '💰 +1 Mio. €'], ['m3', '💰 +1 Mrd. €'], ['lv', '⭐ +5 Level'], ['lvmax', '🔓 Alles freischalten (Level 50)'], ['en', '⚡ Energie voll'], ['pot', '🧪 +3 von jedem Trank'], ['debt', '🧾 Schulden weg'], ['bonus', '🎁 Tagesbonus nochmal'], ['off', '🔒 Cheats ausblenden']];
function cheatHTML() { return `<div style="display:flex;flex-wrap:wrap;gap:8px">${CHEATS.map(([k, n]) => `<button class="btn ${k === 'off' ? 'dark' : 'gold'} xs" data-ch="${k}">${n}</button>`).join('')}</div>`; }
function doCheat(k) {
  const add = v => { S.bal = r2(S.bal + v); S.st.maxBal = Math.max(S.st.maxBal, S.bal); };
  if (k === 'm1') add(1000); else if (k === 'm2') add(1e6); else if (k === 'm3') add(1e9);
  else if (k === 'lv') { S.level += 5; S.xp = 0; } else if (k === 'lvmax') { S.level = Math.max(S.level, 50); S.xp = 0; }
  else if (k === 'en') { S.energy = 10; S.enTs = Date.now(); }
  else if (k === 'pot') { [2, 4, 6].forEach(m => S.pot[m] += 3); }
  else if (k === 'debt') { if (S.bal < 0) S.bal = 0; S.note = 0; }
  else if (k === 'bonus') { S.bonus.last = ''; }
  else if (k === 'off') { S.cheat = false; toast('Cheats ausgeblendet'); save(); return; }
  SND.coin(); FX.burst(30, { coins: true }); hdr(true); checkAch(); save(); toast('😎 ' + CHEATS.find(c => c[0] === k)[1], 'good', 1600);
}

/* ================= Konto & Schulden ================= */
function openKonto(bx) { go('konto'); if (bx) setTimeout(() => { const e = $('#bxSec'); e && e.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 120); }

  applyInterest();
  const neg = S.bal < 0, lk = isLocked(), pct = neg ? Math.min(100, -S.bal / DISPO * 100) : 100;

      <div class="row" style="flex-wrap:wrap;gap:10px">${lk ? '<span class="chip red">Gesperrt</span>' : neg ? '<span class="chip red">Im Dispo</span>' : '<span class="chip gold">Im Plus</span>'}<span class="chip num">Dispo bis ${fmt(-DISPO)}</span></div>

  const d = $('#debt', el); let h = '';
  if (neg) h += `<p style="font-size:19px;line-height:1.5">Du bist mit <b class="neg">${fmt(-S.bal)}</b> im Minus. Verkauf die Schulden an „Inkasso Krause“: Dein Konto steht sofort auf 0. Dafür bekommst du einen Schuldschein über 130 %. Den zahlst du automatisch ab: bei jedem Spin, Los oder jeder Wette gehen 10 % vom Einsatz extra dorthin – und 40 % jedes Gewinns.</p>
      <button class="btn red w" id="dSell" style="margin-top:18px">Schulden verkaufen</button>`;
  if (S.note > 0) h += `${neg ? '<div style="border-top:1px solid var(--line);margin:18px -20px"></div>' : ''}<div class="row sb"><span style="font-size:20px">Schuldschein offen</span><b class="num neg" style="font-size:24px">${fmt(S.note)}</b></div>
      <div style="border-top:1px solid var(--line);margin:16px -20px"></div><div class="row"><input class="inp num" id="dAmt" type="number" inputmode="decimal" placeholder="Betrag"><button class="btn white" id="dPay">Tilgen</button></div>`;
  if (neg || S.note > 0) h += `<div style="border-top:1px solid var(--line);margin:18px -20px 0"></div><button class="linkbtn" id="dIns">Privatinsolvenz anmelden</button>`;
  if (!h) h = '<p style="font-size:19px">Keine Schulden 🎉</p>';
  d.innerHTML = h;
  const sell = $('#dSell', el); if (sell) sell.onclick = () => {
    const debt = -S.bal, nn = r2(debt * 1.3); S.note = r2(S.note + nn); S.bal = 0; S.st.inkasso++;

    S.bal = r2(S.bal - a); S.note = r2(S.note - a); toast(S.note <= 0 ? 'Schuldschein komplett getilgt! 🎉' : `${fmt(a)} getilgt`, 'good'); if (S.note <= 0) { S.note = 0; FX.burst(80); SND.win(); }
    hdr(true); save(); go('konto', true);
  };
  const ins = $('#dIns', el); if (ins) ins.onclick = async () => {
    if (!await confirmBox('Privatinsolvenz?', 'Alle Schulden und der Schuldschein werden gelöscht und dein Konto startet bei 0 €. Dafür verlierst du <b>alle Geschäfte, dein Handelskonto, alle Glückstränke</b> und die Hälfte deiner Level.', 'Insolvenz anmelden', true)) return;
    Object.assign(S, { bal: 0, note: 0, shops: {}, pot: { 2: 0, 4: 0, 6: 0 }, potAct: null, level: Math.max(1, Math.floor(S.level / 2)), xp: 0 });
    S.bx = Object.assign(S.bx, { bal: 0, pos: [], ord: [] }); S.st.insolv++; S.shopTs = Date.now();
    toast('Privatinsolvenz durch – Neustart bei 0 €.'); hdr(true); save(); go('konto', true);
  };
  const amt = () => r2(+$('#bxAmt', el).value || 0);
  $('#bxIn', el).onclick = () => { const a = amt(); if (a <= 0) return; if (S.bal < a) { toast('Nicht genug Guthaben (Dispo zählt nicht).', 'bad'); SND.err(); return; } S.bal = r2(S.bal - a); S.bx.bal = r2(S.bx.bal + a); SND.coin(); toast(`${fmt(a)} aufs Handelskonto eingezahlt`, 'good'); hdr(true); save(); go('konto', true); };
  $('#bxOut', el).onclick = () => { const a = amt(); if (a <= 0) return; const st = bxStats(); if (a > Math.min(S.bx.bal, st.free) + 1e-9) { toast(`Auszahlbar: höchstens ${fmt(Math.max(0, Math.min(S.bx.bal, st.free)))}`, 'bad'); SND.err(); return; } S.bx.bal = r2(S.bx.bal - a); S.bal = r2(S.bal + a); SND.coin(); toast(`${fmt(a)} ausgezahlt`, 'good'); hdr(true); save(); go('konto', true); };
