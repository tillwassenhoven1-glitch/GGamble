/* ===== Auto-Update: erkennt jede Änderung an der Seite (nicht nur die Version) und lädt neu ===== */
function codeHash(doc) {
  let t = ''; doc.querySelectorAll('script:not([src]),style').forEach(e => t += e.textContent.trim());
  let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36) + t.length.toString(36);
}
// erst berechnen, wenn die ganze Seite geladen ist – sonst fehlen spätere <script>-Blöcke und die Seite lädt ständig neu
let MY_HASH = null;
function checkUpdate() {
  if (!/^https?:/.test(location.protocol) || document.readyState === 'loading') return;
  if (!MY_HASH) MY_HASH = codeHash(document);
  // nicht mitten in Freispielen, Duellen, Treff-Räumen oder einer Crash-Runde neu laden – außer bei einem Pflicht-Update
  const busy = (typeof T !== 'undefined' && T.room) || (typeof FDX !== 'undefined' && FDX.cur) || (typeof MS !== 'undefined' && MS && (MS.busy || MS.fs > 0)) || (typeof CR !== 'undefined' && CR.run && !CR.run.done);
  fetch(location.pathname + '?nc=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : null).then(t => {
    if (!t) return;
    const fv = +((/const FORCE_V = (\d+)/.exec(t) || [])[1] || 0);
    if (busy && !(fv > FORCE_V)) return;
    if (document.querySelector('.game-ov[data-run]')) return; // Minispiel läuft (Energie schon bezahlt) → nach dem Spiel
    try { if (S) { S.updReload = 1; } } catch (e) { }
    const h = codeHash(new DOMParser().parseFromString(t, 'text/html'));
    if (h === MY_HASH) return;
    // Schutz gegen Endlosschleife: höchstens 3 Neuladungen pro Minute
    let n = []; try { n = JSON.parse(sessionStorage.getItem('gg_upd') || '[]').filter(x => Date.now() - x < 60000); } catch (e) { }
    if (n.length >= 3) return;
    n.push(Date.now()); try { sessionStorage.setItem('gg_upd', JSON.stringify(n)); } catch (e) { }
    try { S && persist(); } catch (e) { }
    location.replace(location.pathname + '?u=' + h);
  }).catch(() => { });
}
setTimeout(checkUpdate, 800); setInterval(checkUpdate, 45000); document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkUpdate(); if (S) { applyInterest(); regenEnergy(); bxCatchUp(); settleBets(); hdr(); save(); } } });
addEventListener('pageshow', e => { if (e.persisted) checkUpdate(); });
/* Doppeltipp-/Pinch-Zoom auf iPhone/iPad verhindern */
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 300 && !e.target.closest('input,textarea,canvas')) { e.preventDefault(); const t = e.target.closest && e.target.closest('button,[data-ch],.mini,.sl,.it,.odd,.lbar'); if (t) t.click(); } lastTouchEnd = n; }, { passive: false });
/* ================= Start ================= */
$('#ver').textContent = 'Version ' + VERSION; $('#lVer').textContent = 'Version ' + VERSION;
FX.init();
if (WARTUNG) {
  document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;inset:0;z-index:9999;background:#050506;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px;color:#fff">
    <div style="font-size:72px">🛠️</div><h1 style="font-size:36px;margin:0">Wartungsarbeiten</h1>
    <p style="color:#a8a8b0;font-size:18px;max-width:420px;line-height:1.5;margin:0">GGamble ist gleich wieder da! Wir machen gerade ein paar Verbesserungen.<br>Dein Spielstand ist sicher gespeichert 💾</p>
    <p style="color:#6a6a72;font-size:14px;margin:0">Die Seite lädt automatisch neu, sobald es weitergeht.</p></div>`);
  const sp = document.getElementById('splash'); if (sp) sp.remove();
  setInterval(checkUpdate, 30000);
} else
Promise.all([Promise.race([TIME.sync(), new Promise(r => setTimeout(r, 1500))]), new Promise(r => setTimeout(r, 600))]).then(() => {
  $('#splash').classList.add('out'); setTimeout(() => $('#splash').remove(), 800);

});

/* ================= Belohnungen (Battle Pass + Kalender) ================= */

}

  else if (t === 'big') { earn(r2(v * base()), 'Kalender'); S.pot[6] = (S.pot[6] || 0) + 1; }

}

const CR_K = .00009;

const crFmt = m => NF2.format(m) + '×';

function renderCrash(el) {

  $('#crQ', el).onclick = e => { const b = e.target.closest('[data-q]'); if (!b) return; let v = +inp.value || .1; v = { h: v / 2, d: v * 2, min: .1, max: mx }[b.dataset.q]; inp.value = Math.max(.1, Math.min(mx, Math.round(v * 100) / 100)); SND.click(); };

}
function crHist(el) { const h = $('#crH', el); if (h) h.innerHTML = CR.hist.map(m => `<span class="chip num" style="color:${crCol(m)}">${crFmt(m)}</span>`).join(''); }
function crStart(el) {
  const mx = Math.max(.1, Math.floor(maxStake() * 100) / 100);
  let st = Math.round((+$('#crS', el).value || 0) * 100) / 100, au = +$('#crA', el).value || 0;
  if (!isFinite(st) || st < .1) { toast('Mindestens 0,10 €', 'bad'); SND.err(); return; }
  if (st > mx) { toast(`Höchstens ${fmt(mx)} auf deinem Level`, 'bad'); SND.err(); return; }
  if (au && au < 1.01) { toast('Auto-Aussteigen muss über 1,00× liegen', 'bad'); return; }
  CR.stake = st; CR.auto = au || '';
  if (!bet(st, 'Crash')) return;
  CR.run = { stake: st, cp: crashPoint(), auto: au, t0: performance.now(), done: false, el };
  SND.click(); vib(10); crTick();

function crMult(run) { return Math.max(1, Math.floor(Math.exp(CR_K * (performance.now() - run.t0)) * 100) / 100); }
function crTick() {
  const run = CR.run; if (!run || run.done) return;

}
function crCash() { const run = CR.run; if (!run || run.done) return; const m = crMult(run); if (m >= run.cp) return crEnd(run, 'boom', run.cp); crEnd(run, 'cash', m); }
function crEnd(run, how, m) {

    mEl.textContent = crFmt(m); mEl.style.color = '#fff'; tEl.textContent = `Gewinn: ${fmt(r2(run.stake * m))}`;
    rk.style.left = (8 + x * 78) + '%'; rk.style.bottom = (10 + y * 70) + '%'; rk.textContent = '🚀';
    const pts = []; for (let i = 0; i <= 30; i++) { const xi = i / 30 * x, mi = Math.exp(CR_K * xi * 25000), yi = Math.min(1, (mi - 1) / 9); pts.push(`${(8 + xi * 78) * 3},${160 - (10 + yi * 70) * 1.6}`); } p.setAttribute('d', 'M' + pts.join(' L'));
    btn.textContent = `Aussteigen · ${fmt(r2(run.stake * m))}`; btn.className = 'btn gold w'; sky.classList.add('fly'); sky.classList.remove('boom');
  } else {
    sky.classList.remove('fly'); btn.className = 'btn white w'; btn.textContent = 'Starten'; btn.style.fontSize = '22px';
    if (run && run.done) {
      if (run.res === 'boom') { mEl.textContent = crFmt(run.cp); mEl.style.color = '#e8524a'; tEl.textContent = '💥 Explodiert!'; rk.textContent = '💥'; sky.classList.add('boom'); }
      else { mEl.textContent = crFmt(run.m); mEl.style.color = '#4cc265'; tEl.textContent = `✅ Ausgestiegen · Rakete flog bis ${crFmt(run.cp)}`; }
    }
  }
}

/* ================= Bestenliste (neu): Vermögen + Gewinn heute/Woche/Monat ================= */
let rgTab = 0, rgMore = false;
const RG_TABS = [['Vermögen', 'bal'], ['Heute', 'dy'], ['Woche', 'wk'], ['Monat', 'mo']];
/* 📈 Verlauf: Guthaben über die Zeit (für das Rot/Grün-Diagramm) */
function histRec() {
  if (!S) return; S.ph = S.ph || []; const now = Date.now(), last = S.ph[S.ph.length - 1];
  if (last && now - last[0] < 120000) { last[1] = S.bal; return; } // max. 1 Punkt alle 2 Min.
  S.ph.push([now, S.bal]);
  if (S.ph.length > 1500) { // ältere Punkte ausdünnen
    const cut = now - 3 * 864e5, old = S.ph.filter(p => p[0] < cut), recent = S.ph.filter(p => p[0] >= cut), thin = [];
    old.forEach(p => { const l = thin[thin.length - 1]; if (!l || p[0] - l[0] > 36e5) thin.push(p); else l[1] = p[1]; });
    S.ph = [...thin, ...recent];
  }
}
/* Verlauf kompakt für die Bestenliste: max. 60 Punkte "minuten:guthaben" */
function histPack() {
  const ph = (S.ph || []).filter(p => p[0] >= (S.created || 0)); if (!ph.length) return '';
  const step = Math.max(1, Math.ceil(ph.length / 59)), out = [];
  for (let k = 0; k < ph.length; k += step) out.push(ph[k]);
  if (out[out.length - 1] !== ph[ph.length - 1]) out.push(ph[ph.length - 1]);
  return out.map(p => Math.round(p[0] / 6e4).toString(36) + ':' + Math.round(p[1])).join(',');
}
function histUnpack(str) { return String(str || '').split(',').filter(Boolean).map(x => { const [t, b] = x.split(':'); return [parseInt(t, 36) * 6e4, +b]; }).filter(p => isFinite(p[0]) && isFinite(p[1])); }
/* Klassisches Kursdiagramm: Strecken nach oben grün, nach unten rot */
function lineChart(arr, title, sub, delta) {
  if (arr.length < 2) arr = [arr[0] || [Date.now() - 6e4, 0], [Date.now(), (arr[0] || [0, 0])[1]]];
  const t0 = arr[0][0], t1 = arr[arr.length - 1][0], vals = arr.map(a => a[1]), mx = Math.max(...vals), mn = Math.min(...vals), rng = (mx - mn) || 1;
  const W = 300, H = 120, X = t => (t - t0) / Math.max(1, t1 - t0) * W, Y = v => 10 + (mx - v) / rng * (H - 20);
  let segs = '';
  for (let k = 1; k < arr.length; k++) { const up = arr[k][1] >= arr[k - 1][1]; segs += `<line x1="${X(arr[k - 1][0]).toFixed(1)}" y1="${Y(arr[k - 1][1]).toFixed(1)}" x2="${X(arr[k][0]).toFixed(1)}" y2="${Y(arr[k][1]).toFixed(1)}" stroke="${up ? '#2fd36b' : '#ff4d4d'}" stroke-width="2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`; }
  const y0 = Y(arr[0][1]), last = arr[arr.length - 1];
  const short = t1 - t0 < 864e5, fmtT = t => short ? new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : new Date(t).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
  return `<div class="card hchart"><div class="row sb"><b>📈 ${title} <small style="color:var(--mut);font-weight:600">${sub}</small></b><span class="num ${delta < 0 ? 'neg' : delta > 0 ? 'pos' : ''}" style="font-weight:900">${fmt(delta, { sign: true })}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="hsvg"><line x1="0" x2="${W}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="rgba(255,255,255,.22)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>${segs}
      <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" fill="${delta < 0 ? '#ff4d4d' : '#2fd36b'}"/></svg>
    <div class="row sb hax"><small>${fmtT(t0)}</small><small>höchster: <b class="num">${fmt(mx)}</b> · tiefster: <b class="num">${fmt(mn)}</b></small><small>jetzt</small></div></div>`;
}
function histChart(p) {
  const now = Date.now(), start = p === 'bal' ? (S.created || now - 864e5) : Math.max(perStart(p), S.created || 0);
  const pts = (S.ph || []).filter(x => x[0] >= start && x[0] <= now);
  const before = (S.ph || []).filter(x => x[0] < start).pop();
  const startBal = (S.created || 0) >= start - 1000 ? START_BAL : before ? before[1] : pts.length ? pts[0][1] : S.bal;
  const arr = [[start, startBal], ...pts, [now, S.bal]];
  const lbl = { bal: 'seit Start', dy: 'heute', wk: 'diese Woche', mo: 'diesen Monat' }[p];
  return lineChart(arr, 'Dein Verlauf', lbl, r2(S.bal - startBal));
}
/* Zeitraum-Gewinne: Hat das Konto erst in diesem Zeitraum angefangen, ist der Gewinn einfach Guthaben − 500 € Startgeld.
   So sind alle Spieler gleich gezählt – egal, welche Version sie wann hatten. */
const START_BAL = 500;
function perStart(p) { const d = new Date(Date.now()); d.setHours(0, 0, 0, 0); if (p === 'wk') d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); if (p === 'mo') d.setDate(1); return +d; }
function perVal(d, p, tracked) {
  if ((d.since || 0) >= perStart(p)) return r2((d.bal || 0) - START_BAL);
  return tracked === undefined || tracked === null ? null : (+tracked || 0);
}
async function rgFetch() {

/* ================= Freundes-Duelle: Minenfeld & Crash (Topf, 5 % Gebühr) ================= */

const fdCp = seed => { const u = mulberry(seed ^ 0x5bd1e995)(); return Math.min(1000, Math.max(1, Math.floor(.96 / (1 - u) * 100) / 100)); };
const fdMoves = d => (d.mv || '').split(',').filter(x => x !== '').map(Number);

    const jwk = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u.from(ADM_ENC.i) }, k, b64u.from(ADM_ENC.c))));
    ADM_KEY = await crypto.subtle.importKey('jwk', jwk, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']);
    try { localStorage.setItem('gg_adm', code); } catch (e) { }
    return true;
  } catch (e) { return false; }
}
const giftMsg = g => g.k ? `${g.id}|${g.to}|${g.amt}|${g.ts}|${g.k}|${g.x}` : `${g.id}|${g.to}|${g.amt}|${g.ts}`;
const GIFT_K = { m: ['💰', 'Geld'], sp: ['🎰', 'Gratis-Drehs'], en: ['⚡', 'Energie'], p2: ['🧪', 'Glückstrank ×2'], p4: ['🧪', 'Glückstrank ×4'], p6: ['🧪', 'Glückstrank ×6'], lv: ['⭐', 'Level'], ban: ['⛔', 'Sperren'] };
function giftTxt(k, amt, x) {
  if (k === 'fk') return fmt(amt, { sign: true }); // 😜 Fake-Geschenk sieht aus wie echtes Geld
  if (k === 'sp') return `${amt} Gratis-Drehs à ${fmt(x)}`;
  if (k === 'en') return `${amt} Energie ⚡`;
  if (k === 'p2' || k === 'p4' || k === 'p6') return `${amt}× ${GIFT_K[k][1]}`;
  if (k === 'lv') return `${amt > 0 ? '+' : ''}${amt} Level`;
  if (k === 'ban') return amt > 0 ? `Sperre für ${amt} Min.` : 'Entsperrung';
  return fmt(amt, { sign: true });
}
function giftApply(k, a, x) {
  if (k === 'fk') return; // Spaß – es wird nichts gutgeschrieben
  if (k === 'ban') { S.banUntil = a > 0 ? Date.now() + Math.min(60 * 24 * 30, a) * 60000 : 0; S.banBy = ''; banCheck(); return; }
  if (k === 'sp') { const n = Math.max(1, Math.min(500, Math.round(a))), st = Math.max(.1, Math.min(1e6, +x || 1)); S.gspin = S.gspin && S.gspin.st === st ? { n: S.gspin.n + n, st } : { n: (S.gspin ? S.gspin.n : 0) + n, st }; }
  else if (k === 'en') S.energy = (S.energy || 0) + Math.max(1, Math.min(500, Math.round(a)));
  else if (k === 'p2' || k === 'p4' || k === 'p6') { const m = +k[1]; S.pot[m] = (S.pot[m] || 0) + Math.max(1, Math.min(100, Math.round(a))); }
  else if (k === 'lv') { S.level = Math.max(1, Math.min(200, S.level + Math.round(a))); S.xp = 0; }
  else { S.bal = r2(S.bal + a); if (a > 0) S.st.maxBal = Math.max(S.st.maxBal, S.bal); }
}
async function giftVerify(g) {
  try {
    const pk = await crypto.subtle.importKey('jwk', ADM_PUB, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    return await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, pk, b64u.from(g.sig), new TextEncoder().encode(giftMsg(g)));
  } catch (e) { return false; }
}
async function giftSend(to, amt, msg, k = 'm', x = '', von = '') {
  if (!ADM_KEY) { const c = localStorage.getItem('gg_adm'); if (!c || !await admUnlock(c)) throw new Error('key'); }
  const g = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), to, amt, ts: Date.now(), k, x: String(x) };
  const sig = b64u.to(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, ADM_KEY, new TextEncoder().encode(giftMsg(g))));
  const r = await fsCreate('gifts', g.id, { to: fstr(to), amt: { doubleValue: amt }, ts: fint(g.ts), msg: fstr((msg || '').slice(0, 120)), sig: fstr(sig), von: fstr((von || S.disp).slice(0, 24)), k: fstr(k), x: fstr(String(x)) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}
async function giftPoll() {
  if (!S || !onlineOn() || document.hidden) return;
  try {
    const n = await fsQuery({ from: [{ collectionId: 'gifts' }], where: fEq('to', meKey()), limit: 30 });
    S.gifts = S.gifts || [];
    for (const g of n) {
      if (S.gifts.includes(g.id) || Date.now() - (g.ts || 0) > 14 * 864e5 || (g.ts || 0) < (S.created || 0)) continue;
      if (!isFinite(+g.amt) || !await giftVerify({ id: g.id, to: g.to, amt: +g.amt, ts: +g.ts, sig: g.sig || '', k: g.k || '', x: g.x || '' })) continue;
      S.gifts.push(g.id); if (S.gifts.length > 200) S.gifts = S.gifts.slice(-200);
      const a = r2(+g.amt), kd = g.k || 'm'; giftApply(kd, a, g.x);
      if (kd === 'ban') { save(); if (a <= 0) toast('✅ Du bist wieder entsperrt!', 'good', 4000); continue; }
      if (kd === 'fk' && g.x === '1') setTimeout(() => { const ov = document.querySelector('.ov'); const rev = () => setTimeout(() => { toast('😜 Reingelegt! Das Geschenk war nur ein Spaß.', 'good', 5000); SND.click(); }, 400); if (ov) ov.addEventListener('click', rev, { once: true }); else rev(); }, 50);
      save(); hdr(true); lbLast = ''; pushScore(true);
      if (a >= 0) { SND.big(); FX.burst(120, { coins: true }); }
      sheet(`<h2>${a >= 0 ? '🎁 Geschenk!' : '⚖️ Korrektur'}</h2><p class="hint" style="font-size:18px"><b>${esc(g.von || 'Der Besitzer')}</b> hat dir <b class="${a >= 0 ? 'pos' : 'neg'}">${(GIFT_K[kd === 'fk' ? 'm' : kd] || ['🎁'])[0]} ${giftTxt(kd, a, g.x)}</b> ${a >= 0 ? 'geschenkt' : 'abgezogen'}.${kd === 'sp' ? '<br>Einfach an einem beliebigen Automaten drehen – die ersten Drehs sind gratis!' : ''}${g.msg ? `<br><br>„${esc(g.msg)}“` : ''}</p><button class="btn white w" data-close>OK</button>`, { center: true });
    }
  } catch (e) { }
}
/* ⛔ Sperre: Vollbild mit Countdown, solange S.banUntil in der Zukunft liegt */
function banCheck() {
  const left = S && S.banUntil ? S.banUntil - Date.now() : 0; let ov = document.getElementById('banOv');
  if (left <= 0) { if (ov) { ov.remove(); toast('✅ Sperre vorbei – viel Spaß!', 'good'); } if (S && S.banUntil) { S.banUntil = 0; save(); } return; }
  if (!ov) {
    document.querySelectorAll('.full,.game-ov').forEach(x => x.remove()); document.body.classList.remove('inmach'); try { if (typeof MS !== 'undefined') MS = null; } catch (e) { }
    document.body.insertAdjacentHTML('beforeend', `<div id="banOv" style="position:fixed;inset:0;z-index:9998;background:rgba(5,5,6,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px;color:#fff">
      <div style="font-size:72px">⛔</div><h1 style="font-size:34px;margin:0">Du bist gesperrt</h1>
      <p style="color:#a8a8b0;font-size:18px;margin:0">Der Besitzer hat dich vorübergehend gesperrt.</p>
      <div id="banT" class="num" style="font-size:54px;font-weight:900;color:#ff6b6b"></div></div>`);
    ov = document.getElementById('banOv');
  }
  const m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
  const t = document.getElementById('banT'); if (t) t.textContent = `${m}:${String(sec).padStart(2, '0')}`;
}
setInterval(() => { if (S) banCheck(); }, 1000);
function giftStart() { if (!onlineOn()) return; setTimeout(giftPoll, 2500); setInterval(giftPoll, 30000); }
function openGift() {
  const o = sheet(`<div class="row sb"><h2>🎁 Spielern etwas geben</h2><button class="x" data-close>${icon('x')}</button></div>
    <div class="lbl2" style="margin-top:0">Spielername</div><input class="inp" id="gfN" maxlength="18" placeholder="z. B. Robin" autocomplete="off">
    <div class="lbl2">Was?</div><div class="fdgg" id="gfK" style="grid-template-columns:repeat(4,1fr)">${Object.entries(GIFT_K).map(([k, [ic, n]]) => `<button class="btn ${k === 'm' ? 'gold' : 'dark'}" data-k="${k}" style="font-size:13px;padding:10px 4px">${ic}<br>${n.replace('Glückstrank ', '')}</button>`).join('')}</div>
    <div class="lbl2" id="gfAL">Betrag (mit Minus zum Abziehen, z. B. -500)</div><input class="inp num" id="gfA" type="number" inputmode="decimal" placeholder="z. B. 1000">
    <div id="gfXW" class="hidden"><div class="lbl2">Einsatz pro Gratis-Dreh</div><input class="inp num" id="gfX" type="number" inputmode="decimal" value="10"></div>
    <div class="lbl2">Nachricht (optional)</div><input class="inp" id="gfM" maxlength="120" placeholder="z. B. Entschädigung fürs Duell 😉">
    <div class="card tight list" style="background:#151517;margin-top:14px">
      <div class="it"><div style="flex:1"><b>😜 Fake-Geschenk</b><small style="display:block;color:var(--mut)">Sieht echt aus, aber es wird nichts gutgeschrieben (nur bei Geld)</small></div><button class="tog" id="gfF"></button></div>
      <div class="it hidden" id="gfFR"><div style="flex:1"><b>Danach auflösen</b><small style="display:block;color:var(--mut)">Nach „OK“ kommt „😜 Reingelegt!“</small></div><button class="tog" id="gfR"></button></div></div>
    <div id="gfVW" class="hidden"><div class="lbl2">Absender anzeigen als (optional)</div><input class="inp" id="gfV" maxlength="24" placeholder="z. B. Luise"></div>
    <button class="btn gold w" id="gfGo" style="margin-top:16px">Senden</button>
    <p class="hint">Der Spieler bekommt das Geld beim nächsten Öffnen bzw. innerhalb von 30 Sekunden, mit einer Meldung. Geschenke sind fälschungssicher signiert.</p>`);
  let kind = 'm';
  const LBL = { ban: 'Wie viele Minuten sperren? (0 = entsperren)', m: 'Betrag (mit Minus zum Abziehen, z. B. -500)', sp: 'Anzahl Gratis-Drehs', en: 'Wie viel Energie?', p2: 'Wie viele Tränke?', p4: 'Wie viele Tränke?', p6: 'Wie viele Tränke?', lv: 'Wie viele Level? (Minus zum Abziehen)' };
  $('#gfK', o).onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; kind = b.dataset.k; $$('#gfK button', o).forEach(x => x.className = 'btn ' + (x.dataset.k === kind ? 'gold' : 'dark')); $('#gfAL', o).textContent = LBL[kind]; $('#gfXW', o).classList.toggle('hidden', kind !== 'sp'); SND.click(); };
  let fake = false, reveal = false;
  $('#gfF', o).onclick = e => { fake = !fake; e.target.classList.toggle('on', fake); $('#gfFR', o).classList.toggle('hidden', !fake); $('#gfVW', o).classList.toggle('hidden', !fake); };
  $('#gfR', o).onclick = e => { reveal = !reveal; e.target.classList.toggle('on', reveal); };
  $('#gfGo', o).onclick = async function () {
    const nm = $('#gfN', o).value.trim().toLowerCase(), amt = r2(+$('#gfA', o).value || 0), msg = $('#gfM', o).value.trim(), x = kind === 'sp' ? r2(+$('#gfX', o).value || 0) : '';
    if (kind === 'sp' && !(x >= .1)) return toast('Einsatz mindestens 0,10 €', 'bad');
    if (kind !== 'm' && kind !== 'lv' && kind !== 'ban' && amt <= 0) return toast('Anzahl muss größer als 0 sein', 'bad');
    if (kind === 'ban' && amt < 0) return toast('Minuten dürfen nicht negativ sein', 'bad');
    if (!nm) return toast('Name fehlt', 'bad');
    if ((!amt && kind !== 'ban') || !isFinite(amt) || Math.abs(amt) > 1e12) return toast('Ungültiger Betrag', 'bad');

    if (fake && kind !== 'm') return toast('Fake geht nur bei Geld 😜', 'bad');
    const kk = fake ? 'fk' : kind, xx = fake ? (reveal ? '1' : '0') : x, von = fake ? $('#gfV', o).value.trim() : '';
    try { await giftSend(nm, amt, msg, kk, xx, von); SND.win(); toast(`${fake ? '😜 Fake-' : '🎁 '}${giftTxt(kk, amt, xx)} an ${esc(nm)} geschickt`, 'good'); o.close(); }
    catch (e) { this.disabled = false; toast(e.message === 'key' ? 'Bitte Cheat-Code einmal neu eingeben (Admin-Schlüssel fehlt).' : 'Senden fehlgeschlagen – Firebase-Regeln prüfen.', 'bad'); }
  };
}

      <div class="it" id="xFr"><div class="ibox">👥</div><span class="lbl">Freunde &amp; Nachrichten</span><span class="val">${(S.friends || []).length}</span>${icon('right', 'chev')}</div>
      <div class="it" id="xClan"><div class="ibox">🏢</div><span class="lbl">Clan</span><span class="val">${S.clan ? '[' + esc(S.clan.tag) + ']' : 'keiner'}</span>${icon('right', 'chev')}</div></div>`);
