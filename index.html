<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GGamble</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23111'/><text x='50' y='64' font-size='42' text-anchor='middle' font-family='Arial' font-weight='900' fill='%23e8c45a'>GG</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash"><div class="logo-big">GGamble</div><div class="logo-sub">Nur Spielgeld</div><div class="splash-bar"><i></i></div></div>

<div id="login" class="hidden">
  <div class="login-box">
    <span class="logo-big">GGamble</span>
    <p class="lead">Spielhalle, Rubbellose, Wetten &amp; Börse – nur mit Spielgeld.</p>
    <div class="seg"><button id="tReg" class="on">Konto erstellen</button><button id="tLog">Anmelden</button></div>
    <input id="lName" class="fld" placeholder="Name" maxlength="18" autocomplete="username">
    <input id="lPw" class="fld" type="password" placeholder="Passwort" autocomplete="current-password">
    <input id="lPw2" class="fld" type="password" placeholder="Passwort wiederholen" autocomplete="new-password">
    <div class="err" id="lErr"></div>
    <button class="btn white w" id="lGo">Los geht's</button>
    <p class="small">Dein Konto wird in diesem Browser gespeichert – du bleibst eingeloggt.<br>Kein echtes Geld, keine Käufe, keine Werbung.</p>
  </div>
</div>

<div id="app" class="hidden">
  <header id="hdr">
    <div class="pill balpill" id="hBalPill">
      <div class="gglogo">GG</div>
      <div class="balwrap"><div id="hBal" class="num">0,00 €</div><div id="hToday" class="num">±0,00 € heute</div></div>
      <div class="lockb hidden" id="hLock"></div>
    </div>
    <button class="pill circbtn" id="hChat"></button>
    <div class="pill lvlpill" id="hLvl">
      <div class="lvlring"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" stroke="#3a3a3f" stroke-width="3.5" fill="none"/><circle id="lvlArc" cx="24" cy="24" r="20" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="125.66" style="transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)"/></svg><span id="lvlNum">1</span></div>
      <div class="avatar" id="hAva">?</div>
    </div>
  </header>
  <main id="main"></main>
  <nav id="nav" class="pill"></nav>
</div>

<div id="toasts"></div>
<canvas id="fx"></canvas>

<script src="core.js"></script>
<script src="slots.js"></script>
<script src="lose.js"></script>
<script src="wetten.js"></script>
<script src="boerse.js"></script>
<script src="spiele.js"></script>
<script src="social.js"></script>
<script src="app.js"></script>
</body>
</html>
